# Nhập môn — chủ đề và ba case xuyên suốt

**Trình độ:** cao học · **Điều kiện tiên quyết:** không · Đây là module lớn nhất chương trình, và là cái xương sống định lượng đỡ lấy mọi thứ còn lại.

**Học xong mày cầm được cái gì** — cầm bộ số thô của bất kỳ công ty nào và: (a) đọc ba báo cáo tài chính của nó như *một hệ thống khớp vào nhau*; (b) chứng minh một khách hàng có lời hay không và mô hình cư xử ra sao khi bị ép; (c) chỉ ra hai ba đòn bẩy thực sự làm dịch chuyển giá trị doanh nghiệp (enterprise value); (d) phác được doanh nghiệp đáng giá bao nhiêu và bảo vệ được con số đó.

**Kết quả học tập (làm *được*, không phải đọc thuộc):**
1. Lần một sự kiện kinh doanh xuyên cả ba báo cáo tài chính cùng lúc.
2. Tách bạch ba thứ — lợi nhuận kế toán, lợi nhuận kinh tế, tiền mặt — và hiểu vì sao cả ba lệch nhau.
3. Suy ra LTV từ gốc và nêu bốn giả định mà dưới đó nó nói dối.
4. Dựng một P&L theo biên đóng góp (contribution margin); tính điểm hòa vốn và đòn bẩy vận hành.
5. Áp logic chiết khấu dòng tiền (discounted cash flow) và giải thích vì sao SaaS được định giá theo bội số doanh thu tương lai.

Nhãn độ tin dùng xuyên suốt: `[established]` chắc như sách giáo khoa · `[synthesis]` tao tự ráp lại · `[contested]` dân trong nghề còn cãi nhau · `[heuristic]` quy tắc dùng được, không phải định luật.

## Ba case chạy xuyên suốt

Một công ty chỉ dạy được một hình dạng. Nên module này vác theo **ba**, chọn vì chúng lệch nhau trên mọi trục quan trọng — và chính cái lệch đó *là* bài học. Khi cùng một công thức nhả ra ba phán quyết khác nhau một trời một vực, mày mới thật sự học được công thức đó rốt cuộc phụ thuộc vào cái gì.

| | **Figma** (A) | **Salesforce** (B) | **Mailchimp** (C) |
|---|---|---|---|
| Mẫu hình | PLG, từ dưới lên, mid-market | Enterprise, sales dẫn dắt | SMB, tự phục vụ |
| Cách bán | Product-led, tự phục vụ | Từ trên xuống (AE + sales engineer) | Hoàn toàn tự phục vụ |
| Giá niêm yết | $20 / seat / tháng | $48,000 / năm (ACV) | $29 / tháng |
| Cách thu tiền | Theo năm, trả trước | Theo năm/nhiều năm, trả trước | Theo tháng |
| Tài khoản điển hình | 5 seat → $100/tháng | ~$4,000/tháng thực thu | $29/tháng |
| Biên gộp | 82% | 78% | 85% |
| Churn logo hàng tháng | 2.5% | 0.5% | 6% |
| Mở rộng (NRR) | ~110% | ~125% | ~95% |

Ba nhà sáng lập, ba con đường, ba cách cùng một bài toán — *biến tiền thành nhiều tiền hơn, lặp đi lặp lại được* — được giải. Giữ cái bảng này bên tay; chương nào cũng lấp thêm vào nó.

**Đây là những gã khổng lồ thật — dùng lai lịch của chúng làm cái móc trí nhớ** (mẫu hình là thật; còn các con số cụ thể trong module này là minh họa, không phải sổ sách thật của chúng):
- **Figma (A)** — PLG từ dưới lên. Một designer kéo cả team vào, team kéo cả tổ chức vào; doanh thu lớn lên theo *seat*, không phải theo logo mới. Bán cho Adobe ~$20B — hình mẫu land-and-expand kinh điển.
- **Salesforce (B)** — gã khổng lồ enterprise do sales dẫn dắt. Hợp đồng năm to đùng chốt bởi account exec, CAC tàn bạo, nhưng khách cắm rễ sâu tới mức gần như không bao giờ rời. Nó viết ra cái playbook SaaS hiện đại.
- **Mailchimp (C)** — SMB tự phục vụ đại trà. Hàng triệu doanh nghiệp tí hon, đăng ký bằng thẻ tín dụng, không một mống sales — và một tệp khách churn dữ dội vì bản thân mấy doanh nghiệp nhỏ đến rồi đi. Bootstrap tới thương vụ bán cho Intuit ~$12B.

<p class="kicker">M1 · Chương 1</p>

# Doanh nghiệp như một cỗ máy tạo giá trị

Đây là một quyết định mày sẽ gặp với tiền thật đặt trên bàn: có người chìa ra một công ty đang báo **lợi nhuận** đẹp rồi nhờ mày rót vốn, mua lại, hoặc đặt cả sự nghiệp vào việc điều hành nó. Gật đầu dựa trên cái nghĩa sai của chữ "lợi nhuận", mày có thể đang chống lưng cho một doanh nghiệp chết dần trong khi báo cáo lãi lỗ của nó vẫn nhơn nhơn khoe lãi. Chương này là liều vắc-xin — mà thật ra đơn giản hơn nhiều so với cái vẻ hầm hố đống thuật ngữ dựng lên. Học xong, không ai chìa chữ "lợi nhuận" cho mày mà mày không bật lại ngay: *loại nào?* Riêng cái phản xạ đó thôi đã là phần lớn thứ ngăn cách kẻ đọc được báo cáo tài chính với kẻ bị nó lừa.

Bởi mày đang sẵn mang một cái bẫy trong đầu. Hỏi "doanh nghiệp này có kiếm ra tiền không", mày đã có sẵn câu trực giác: **tiền vào trừ tiền ra**. Nghe hiển nhiên đúng, và thi thoảng nó *đúng* thật — do may. Nhưng nó lặng lẽ gộp ba câu hỏi mà quý nào cũng hay chỏi nhau: *hoạt động có tạo ra thặng dư không, số dư ngân hàng có tăng không, và mình có tạo ra giá trị gì không?* Một công ty có thể vừa báo lãi kỷ lục, vừa cạn sạch tiền, vừa phá hủy giá trị — cùng một lúc — mà cái phản xạ đo bằng một con số chẳng thấy cú nào tới. Nên bước đầu của việc biết đọc tài chính là từ chối cái gộp đó, tách ba thứ ra.

Tất cả gói lại trong một câu hỏi — *sau một quãng làm ăn, mày có khá hơn không?* — trả lời bằng cách lấy cái thu về trừ cái bỏ ra. Toàn bộ trận đánh nằm ở vế sau: **cái gì được tính là "bỏ ra".** Ba cách trả lời thành thật, ra ba loại lợi nhuận. Cứ bám câu hỏi, đừng bám công thức, rồi từng loại sẽ tự lòi ra.

### Lợi nhuận kế toán
*Kỳ này hoạt động có nhả ra thặng dư không, đo bằng một bộ luật nhất quán?*

Vấn đề nó giải: thời điểm tiền mặt thô nói dối. Mày mua một cái máy một lần và nó sinh lời trong năm năm; mày thu phí cả năm trả trước cho một dịch vụ mày giao hàng tháng. Đếm tiền mặt trong một quý và mày đọc sai liệu hoạt động có tạo ra được gì.

Nên kế toán mới xoay quanh một quy ước — **nguyên tắc khớp (matching principle)**: ghi doanh thu khi nó *được kiếm* (giá trị đã giao), rồi đặt đối lại đúng những chi phí *phát sinh để tạo ra khoản doanh thu đó*, bất kể tiền thật dịch chuyển lúc nào. "Chi phí kế toán" = phần nguồn lực đốt ra để tạo khoản doanh thu mày đang ghi nhận.

Đây là chỗ sách giáo khoa hay bỏ quên: lợi nhuận này "đúng" theo kiểu **luật cờ vua** — một quy ước con người thống nhất với nhau (GAAP/IFRS), không phải định luật có sẵn trong tự nhiên. `[established-as-convention]` Đó là *lý do nó chỉ là một ý kiến*: khấu hao nhanh hơn một chút, ghi doanh thu "đã kiếm" sớm hơn một chút, đoán nợ xấu thấp hơn một chút — thế là con số nhảy. Hai kế toán viên đều trung thực vẫn dừng ở hai chỗ khác nhau.

**Lăng kính đúng** để so sánh hiệu quả vận hành qua các kỳ hoặc giữa các công ty (vì sao bộ luật phải được chuẩn hóa). **Mù với** hai thứ: khi nào tiền thực sự dịch chuyển, và vốn của mày lẽ ra kiếm được gì ở chỗ khác — và mỗi cái mù đó chính là lý do hai loại lợi nhuận tiếp theo tồn tại.

### Lợi nhuận tiền mặt
*Số dư ngân hàng có thực sự tăng không?*

Tiền vào trừ tiền ra. Con số duy nhất không ai nắn được: lợi nhuận là một ý kiến, **tiền mặt là một sự thật** — mày có nó hoặc mày không có. `[established]`

Doanh nghiệp hiếm khi chết vì P&L xấu; chúng chết khi cạn tiền. Đó là lý do một công ty tăng trưởng nhanh, "có lời", vẫn có thể sập — tăng trưởng ăn tiền (trả để giành khách bây giờ, thu về sau). **Mù với** chuyện kỳ này có tạo ra giá trị hay không: mày có thể trông giàu tiền nhờ quỵt nhà cung cấp, hoặc trông cạn tiền trong khi cực khỏe vì mày đã trả trước một năm tăng trưởng.

### Lợi nhuận kinh tế
*Mình có tạo ra giá trị vượt cái mà đồng tiền đó lẽ ra kiếm được ở chỗ khác không?*

Cái mà trường kinh doanh tồn tại để cài vào đầu mày, vì nó bắt được một lời nói dối mà hai loại kia cho đi qua: **cả hai đều coi vốn nằm kẹt trong doanh nghiệp là miễn phí.** Không phải. Tiền đậu trong công ty mày lẽ ra kiếm được lợi suất ở chỗ khác với mức rủi ro tương đương — cái lợi suất bị bỏ lỡ đó, tức **chi phí vốn (cost of capital)**, là thật dù chẳng có hóa đơn nào gửi tới đòi nó.

Nên: lợi nhuận kinh tế = lợi nhuận kế toán − chi phí của vốn đã dùng. Một công ty kiếm 4% trên vốn có giá 12% thì báo lợi nhuận kế toán trong khi *phá hủy* của cải.

Hai tầng, hai loại sự thật: *chi phí cơ hội đó có thật* là một quy luật được khám phá ra `[established-as-finding]`; còn *con số* mày đem trừ — chi phí vốn của mày — chỉ là một ước lượng theo quy ước, thứ người ta cãi nhau bất tận. `[contested]`

| Lợi nhuận | Câu hỏi | Cái mày trừ đi | Loại sự thật |
|---|---|---|---|
| **Kế toán** | Kỳ này hoạt động có thặng dư không? | Chi phí đã ghi sổ (dồn tích) | Quy ước — một bộ luật |
| **Tiền mặt** | Số dư ngân hàng có tăng không? | Dòng tiền ra thực tế | Sự thật — không nắn được |
| **Kinh tế** | Mình có thắng phương án thay thế của vốn không? | Chi phí *cộng* chi phí vốn | Phát hiện + một ước lượng |

> Quên hết công thức đi và mày vẫn dựng lại được từ một câu nhắc — *tao đang trừ đi cái gì?* "Chúng tôi có lời" là một tuyên bố kế toán, "chúng tôi không cạn tiền" là chuyện sống sót, "chúng tôi tạo ra giá trị" là kinh tế. Cả ba có thể chỏi nhau trong cùng một quý.

### Dân vận hành thực sự cầm ba thứ này thế nào
Ở trên bàn chúng không ngang nhau, và thứ hạng lật theo giai đoạn.

- **Giai đoạn đầu** — một founder/CFO canh **tiền mặt/runway** (cái giết mày) và **biên gộp** (liệu quy mô có cứu được mày), và coi lợi nhuận kế toán ròng gần như hư cấu cho tới khi doanh nghiệp đủ chín để bị đánh giá bằng nó. `[synthesis]`
- **Khi động cơ lợi ích dính vào** — người ta *chế* con số. Dấu hiệu là **"adjusted EBITDA"**: cộng ngược lại mọi thứ xấu xí để ra một con số đẹp hơn. WeWork chơi hẳn một "Community-Adjusted EBITDA" cộng ngược cả marketing lẫn chi phí quản lý, trong bản S-1 năm 2019. `[established — WeWork S-1]` Đọc được cái đó thì chẳng deck nào lừa được mày.
- **Cái thực sự được nói ở bàn** — không phải lợi nhuận kế toán, mà là câu **"default-alive hay default-dead?"** của Paul Graham `[established — Graham 2015]` — một câu hỏi *tiền mặt* thuần túy.
- **Lợi nhuận kinh tế, không gọi tên** — mọi quyết định "có tiếp tục rót vào mảng này / mua lại cổ phiếu / bật đèn xanh cho dự án này" *đều là* nó. Các hãng lớn chính thức hóa nó thành **EVA** (Stern Stewart). `[established]`

Từ vựng thì trốn trong tường; còn cái logic thì chạy mọi quyết định về vốn.

### Chốt đi
Một founder chìa cho mày một cái deck: **lợi nhuận kế toán kỷ lục, quý đẹp nhất từ trước tới giờ**, và xin một khoản vay bắc cầu để tiếp tục tăng trưởng. Trước khi đọc tiếp, quyết trong một dòng: *trong ba con số, mày đòi xem con số nào, và mỗi con số phải nói gì thì mày mới ký séc?*

Trọng điểm không phải một đáp án đúng — mà là giờ mày từ chối cái phiên bản một-con-số. Một cách đọc bảo vệ được: **tiền mặt/runway** quyết định liệu họ có sống nổi tới lúc *dùng* được khoản vay không (một công ty có lời có thể mất khả năng thanh toán ngay thứ Sáu tuần này); **lợi nhuận kế toán** cho mày biết hoạt động có thực sự chạy hay "lợi nhuận" chỉ là ảo ảnh dồn tích; **lợi nhuận kinh tế** cho mày biết tiền mày cho vay có kiếm được nhiều hơn cái giá của nó không — nếu không thì mày đang tài trợ cho việc phá hủy giá trị theo kiểu vòng vo hơn. Bỏ sót câu hỏi tiền mặt thì cái deck lợi nhuận kỷ lục kia chính là cách mày bị úp sọt. Cái phản xạ đó — *lợi nhuận loại nào, và nó mù với cái gì* — là cả chương này.

### Mô hình là nơi giá trị được giữ lại
Một **mô hình kinh doanh** là một *kiến trúc giữ giá trị (value-capture)*: cho rằng sản phẩm tạo ra giá trị V cho khách, mô hình quyết định mày giữ lại bao nhiêu phần của V, khi nào, và giữ chắc tới đâu. Ba case của ta làm ba kiểu — Salesforce moi nhiều từ ít khách (ACV cao), Mailchimp moi ít từ nhiều khách (số lượng), Figma đáp xuống nhỏ rồi mở rộng. Không cái nào "đúng"; mỗi cái là một cỗ máy khác nhau, như các con số sẽ cho thấy.

# Ba báo cáo tài chính như một hệ thống

Hai founder chìa cho mày cùng một sự thật — *"$1,200 rơi vào tài khoản quý này"* — mà nó mang hai nghĩa ngược nhau: với người này nó là món quà tài trợ cho tăng trưởng, với người kia nó là một khoản nợ mà họ sẽ chảy máu tiền để giao hàng. **Không một báo cáo đơn lẻ nào cho mày biết là bên nào.** Đọc sai và mày nhầm một cỗ máy tự nuôi mình thành một cái bẫy tiền mặt, hoặc tệ hơn, nhầm ngược lại — đúng cái lỗi quyết định mày sẽ rót vốn cho ai và bỏ chạy khỏi ai. Phần yên tâm: chỉ có *ba* báo cáo, một đẳng thức trói chúng lại, và một khi mày đã thấy chúng gợn sóng sang nhau thì thật sự không gỡ mắt ra được. Chương này cài cái phản xạ đó.

### Lần thử — một hợp đồng Figma xuyên cả ba

Figma ký một tài khoản mới: **$1,200 trả trước** cho 12 tháng. Chi phí giao hàng bằng 18% doanh thu (biên 82%), rải đều.

**Ngày 0 — tiền vào, chưa kiếm được gì.** Lưu chuyển tiền tệ **+$1,200**. Bảng cân đối: Tiền mặt **+$1,200**, Doanh thu chưa thực hiện (Deferred Revenue) **+$1,200** (một khoản *nợ* — mày nợ 12 tháng dịch vụ; đẳng thức vẫn đúng). P&L: **$0** — mày chưa *kiếm* được gì. Doanh thu được ghi nhận khi giao hàng, không phải khi tiền rơi vào. `[established]`

**Cuối Tháng 1 — kiếm được một tháng.** P&L: Doanh thu **+$100**, COGS **−$18**, lợi nhuận gộp **+$82**. Bảng cân đối: Doanh thu chưa thực hiện **−$100** (giờ còn $1,100), Vốn CSH **+$82**. Lưu chuyển tiền tệ: **$0** (tiền đã tới rồi).

> **Cái insight hầu hết bỏ lỡ — đây là một *món quà tiền mặt*.** Figma đang giữ $1,200 tiền của khách trong khi mới kiếm được $100. Cái $1,100 doanh thu chưa thực hiện đó là một khoản vay không lãi từ chính khách hàng, và nó *tài trợ cho tăng trưởng* — trong SaaS, đây là **vốn lưu động âm (negative working capital)**. Đó là một lý do mang tính cấu trúc khiến SaaS thu năm-trả-trước lớn nhanh hơn trên ít tiền ngoài hơn so với một đối thủ thu theo tháng. `[established]`

**Giờ so với Mailchimp.** Mailchimp thu **$29 theo tháng** — không có món quà trả trước. Ngày 0: Tiền mặt +$29, doanh thu ghi nhận ~$29 tháng đó, doanh thu chưa thực hiện ≈ $0. Mailchimp không bao giờ được khoản vay do khách tài trợ. Cùng một logic sản phẩm, hành vi bảng cân đối ngược nhau — hoàn toàn từ **lựa chọn cách thu tiền.** (Salesforce cư xử như Figma nhưng to gấp 40 lần: một hợp đồng trả trước $48k đậu một khoản nợ doanh thu chưa thực hiện to đùng, và nó nuôi luôn công ty.)

**Chốt hạ:** P&L nói "+$82," ngân hàng nói "+$1,200 một lần, rồi hết," bảng cân đối ghi lại một khoản vay từ khách. Tất cả đều đúng. Chỉ đọc một báo cáo là cách người giỏi bị úp sọt.

### Chốt đi
Hai công ty SaaS đều báo **doanh thu $1.2M, tăng trưởng 80%.** Công ty A thu năm trả trước; Công ty B thu theo tháng. Trước khi đọc tiếp: *không cần nhìn số dư ngân hàng, bên nào nhiều khả năng phải đi gọi vốn trong năm nay hơn — và mày nhìn chỗ nào trên báo cáo để xác nhận?*

Dòng doanh thu không trả lời được — nó giống hệt nhau, và nó là dồn tích. Câu trả lời sống trong cái gợn sóng. Việc A thu trả trước đậu một khoản nợ **doanh thu chưa thực hiện** béo múp: tiền của khách đã nằm sẵn trong tay, nuôi tăng trưởng (vốn lưu động âm, đúng cái "món quà" ở trên). B thu nhỏ giọt trong khi phải trả tiền giành khách *trước khi* tiền của khách về, nên với mỗi logo mới nó lại âm tiền suốt mấy tháng. Cùng dòng đỉnh, hai cuộc đời tiền mặt ngược nhau — nên mày nhìn vào **doanh thu chưa thực hiện** và vào **khoảng cách giữa lợi nhuận và dòng tiền**, đừng bao giờ nhìn dòng doanh thu. Cái khoảng cách đó là toàn bộ Chương 3.

# Dồn tích, tiền mặt, và tại sao tăng trưởng đốt tiền

Mày sẽ đoán — mà đoán vậy cũng có lý — rằng công ty có lãi là công ty an toàn: P&L (báo cáo lãi lỗ) mà xanh thì cạn tiền là chuyện của thằng khác. Chính cái trực giác đó đã chôn nhiều doanh nghiệp tử tế hơn gần như mọi thứ khác. Bởi lợi nhuận và tiền mặt *không phải một thứ*, và một công ty lớn nhanh có thể thừa cái đầu mà thiếu cái sau: mọi con số đều bảo mày đang thắng, rồi một sáng nào đó không còn tiền trả lương. Chương này dạy mày nhìn ra bức tường ấy từ cách xa mấy tháng — và tới ngày mày ngồi ghế vận hành hay xuống tiền cho một doanh nghiệp đang phình to, chính khoảng nhìn trước đó là ranh giới giữa một vòng gọi vốn thong thả và một cú bán tháo.

Bắt đầu từ *vì sao* hai thứ này lệch. Tăng trưởng ngốn tiền **ngay lúc này** — mày trả để giành khách, dựng sản phẩm, tuyển người, tất cả trước khi doanh thu về — nhưng dòng tiền do nó đẻ ra lại về **sau**, rỉ ra dần suốt đời khách. Vậy nên mỗi bước tăng trưởng là một ván "chi trước, thu sau", và lớn càng nhanh thì càng ôm nhiều ván cùng lúc. **Tự thân tăng trưởng banh rộng khoảng cách giữa lợi nhuận và tiền mặt** — và đây mới là chỗ ác: cầu càng khỏe, một doanh nghiệp vận hành ngây thơ càng đốt tiền tợn. Cùng một quyết định "giành một tài khoản", đặt vào ba công ty — một sự kiện, ba số phận tiền mặt:

| Tại thời điểm giành một tài khoản | Figma | Salesforce | Mailchimp |
|---|---|---|---|
| Tiền thu về trước | $1,200 | $48,000 | $29 |
| CAC trả trước | $600 | $60,000 | $90 |
| **Tiền ròng ở Ngày 0** | **+$600** | **−$12,000** | **−$61** |
| Hình dáng dòng tiền | Tự nuôi mình | Hố sâu mỗi thương vụ | Âm tiền ~3–4 tháng |

Nhìn kỹ: **Figma dương tiền ngay giây ký được khách** — nó lớn lên bằng chính tiền của khách. **Salesforce lỗ vốn $12,000 mỗi thương vụ dù đã được trả trước cả cục** — mỗi khách mới đòi một khoản bỏ ra trước; kiểu tăng trưởng sales-led đói vốn ngay từ trong thiết kế. **Mailchimp nhìn thì rẻ (CAC có $90 thôi mà) nhưng thu theo tháng**, nên mỗi khách nó âm tiền suốt 3–4 tháng đầu và chẳng bao giờ có nổi cái đệm trả-trước. `[established]`

Cái mớ tiền bị kẹt đó có tên hẳn hoi: **vốn lưu động** (working capital) — số tiền bị chôn trong khoảng cách giữa lúc mày *chi ra* (để xây, giao hàng, giành khách, trả lương) và lúc mày *thu về* từ khách. Hình dung chu kỳ vận hành như một vòng lặp: tiền rời đi để sản xuất và bán, rồi quay về khi khách trả tiền. Bất cứ thứ gì đang "bay lơ lửng" quanh vòng lặp đó tại một thời điểm chính là vốn lưu động — **tiền mày sở hữu nhưng không tiêu được.** Lớn lên đi, vòng lặp gánh nhiều tiền hơn, đó là lý do scale một doanh nghiệp thu tiền chậm sẽ rút cạn ngân hàng ngay cả khi P&L leo dốc. Mô hình thu tiền quyết định *dấu*: thu **trước** khi giao (trả trước cả năm) thì khách nuôi vòng lặp của mày — vốn lưu động *âm*, món quà từ Chương 2; thu **sau** (theo tháng, hoặc hóa đơn net-60) thì mày nuôi vòng lặp của họ.

Giờ thì cái câu tưởng vô lý tan ra. **"Có lãi mà hết tiền"** = lợi nhuận ghi theo dồn tích (kiếm được rồi, chưa thu về) trong khi tiền mặt là chuyện thời điểm, và khoảng cách giữa hai thứ đó *chính là* vốn lưu động cộng với khoản chi tăng trưởng trả trước của mày. Một công ty báo lợi nhuận ròng khỏe mạnh trong khi số dư tụt dần không hề nói dối — nó đang lớn nhanh hơn tốc độ thu tiền, lấy dự trữ của chính mình bù vào phần chênh cho tới khi cạn. `[established-as-finding]`

> **Quy tắc vận hành** `[heuristic]`: với gói thuê bao thu theo tháng, cái đáy tiền mặt mỗi cohort ≈ `CAC − (months-to-payback × monthly contribution)`, sâu nhất ngay lúc giành khách và leo dần lên khi biên đóng góp nhỏ giọt về. Trả trước cả năm lật ngược cái dấu — mày khởi đầu *trên* mặt nước. Cách mày thu tiền có thể là toàn bộ khác biệt giữa cần một vòng gọi vốn và không cần.

**Dân vận hành sống với cái này ra sao.** Hai con số một founder soi mỗi ngày lại chẳng nằm trên P&L: **burn rate** (tiền ròng chảy ra mỗi tháng) và **runway** (số tháng còn trụ được = tiền ÷ burn). `[synthesis]` Thứ một CFO thực sự dán mắt vào là bản dự báo tiền mặt cuốn chiếu 13 tuần — báo cáo lãi lỗ là để trình hội đồng, còn dự báo tiền mặt là để sống sót. Và điều khoản thanh toán là một *vũ khí tiền mặt*: lý do SaaS ép trả trước cả năm ghê vậy, chịu thả giảm 15–20% để đổi lấy nó, không phải vì doanh thu — mà để kéo trọn một năm tiền về phía trước nuôi tăng trưởng mà khỏi phải gọi vốn; còn khách doanh nghiệp thì đẩy ngược lại bằng net-60/90 để nuôi vốn lưu động của *họ* bằng tiền của *mày*. Mọi cuộc mặc cả điều khoản thanh toán đều là một trận giành vốn lưu động khoác áo giảm giá. Câu vang lên trong phòng chưa bao giờ là "mình có lãi không" — mà là **"runway còn mấy tháng, và cú này kéo dài hay rút ngắn nó?"**

### Chốt đi
Hai doanh nghiệp tăng trưởng y hệt nhau ở 80%/năm với cùng biên. Doanh nghiệp A thu tiền cả năm trả trước; doanh nghiệp B bán cho khách doanh nghiệp với điều khoản net-60. Trước khi đọc tiếp: *cái nào có thể lớn nhanh hơn mà không cần gọi vốn ngoài — và nếu mày vận hành cái đói tiền kia, cần gạt cái đòn bẩy nào đầu tiên trước khi nhận một xu pha loãng cổ phần?*

A lớn lên bằng tiền của khách (vốn lưu động âm); B *cho khách vay* và phải tài trợ khoảng chênh đó, nên ở cùng tốc độ tăng trưởng, B cần nhiều vốn hơn hẳn chỉ để đứng yên tại chỗ. Và cái đòn bẩy cho B không phải "gọi vốn" — mà là **đổi điều khoản**: rút ngắn kỳ thu, thêm chiết khấu trả trước, xuất hóa đơn ngay khi ký chứ không đợi giao hàng. Giải phóng vốn lưu động thường là nguồn tiền lớn hơn, nhanh hơn, rẻ hơn một vòng gọi vốn — và nó không tốn cổ phần nào. Nhìn vào vốn lưu động *trước khi* mày cho rằng mình cần vốn.
</script>

<script type="text/markdown" id="content-M1-4">
<p class="kicker">M1 · Chương 4</p>

# Unit economics, làm cho chặt

Mỗi đồng mày sẽ tiêu cho tăng trưởng đều cưỡi trên một canh bạc: rằng một khách hàng đáng giá hơn cái giá để giành được nó. Unit economics là nơi mày *chứng minh* canh bạc đó thay vì cầu trời cho nó đúng — và là nơi mày học ra rằng chính con số mà ai cũng trích để chứng minh nó, **LTV:CAC**, là một dự báo đội lốt sự thật: gian lận được, chất đầy giả định, và tới lúc quan trọng thì thường sai. Bản năng là đọc "5:1" như một phán quyết — *khỏe đấy, cứ tiêu tiếp đi.* Hết chương này mày sẽ không chấp nhận một con LTV:CAC nào mà không hỏi ba thứ — *CAC nào*, đã chiết khấu hay chưa, và dựa trên giả định churn *nào* — vì mỗi thứ đều có thể lặng lẽ biến một con 5:1 thành 2:1 hoặc thành ảo ảnh. Cái phản xạ tra hỏi đó chính là toàn bộ kỹ năng; công thức chỉ là cách mày chạy nó thôi.

Zoom vào một khách hàng. Mọi thuật ngữ dưới đây đều được *dựng nên*, không phải phán bừa.

## 4.1 CAC — ba phiên bản trung thực
`CAC = (toàn bộ chi phí giành khách) / (số khách mới nó tạo ra)`. Chữ *toàn bộ* là chỗ người ta nói dối. `[synthesis of established parts]`
- **Blended CAC** — tổng S&M / toàn bộ khách mới (trả tiền + tự nhiên tới). Nịnh mày; khách organic kéo cái trung bình xuống.
- **Paid CAC** — chi phí trả tiền / khách từ các kênh trả tiền. Quyết định chuyện giành khách có *scale* được không.
- **Fully-loaded CAC** — tính cả lương/công cụ/chi phí chung của việc giành khách, chứ không chỉ tiền quảng cáo. Con số thật sự đúng.

> Nếu blended CAC trông ngon mà paid CAC lại lỗ chỏng gọng, mày đang chạy nhờ một *kênh miễn phí không vặn to lên được* — chính là tình huống SHT/PageFly, quy ra số. Blended CAC là chỗ cái phân phối đi mượn ẩn mình. Nó cũng là lý do con $90 của Mailchimp mong manh: bóp chết kênh organic đi thì nó chẳng còn là $90.

## 4.2 Biên đóng góp
`Contribution = ARPA × gross margin%` — doanh thu trừ đi chi phí *biến đổi* để phục vụ, không phải cả doanh thu. Figma: `$100 × 0.82 = $82/mo`. `[established]`

## 4.3 LTV — suy ra, không phải trao tận tay
Một khách trả biên đóng góp `m` mỗi kỳ, sống sót qua mỗi kỳ với xác suất `r = 1 − c` (c = churn). Giá trị vòng đời kỳ vọng là một **chuỗi cấp số nhân**:
```
LTV = m × Σ rᵗ  (t=0,1,2,…) = m × 1/(1−r) = m / c
```
Nên "chia cho churn" chẳng có gì huyền bí — `1/c` *chính là* số kỳ kỳ vọng sống sót (kỳ vọng của phân phối hình học). `[established]`

## 4.4 Ba trường hợp, tính ra hẳn

| Chỉ số | Figma | Salesforce | Mailchimp |
|---|---|---|---|
| Biên đóng góp / tháng | $82 | $3,120 | $24.65 |
| Vòng đời trung bình (1/c) | 40 mo | 200 mo | 16.7 mo |
| **LTV (chưa chiết khấu)** | **$3,280** | **$624,000** | **$411** |
| CAC | $600 | $60,000 | $90 |
| **LTV:CAC (chưa chiết khấu)** | **5.5 : 1** | **10.4 : 1** | **4.6 : 1** |
| Payback (tháng) | 7.3 | 19.2 | 3.7 |

Đọc hàng chưa-chiết-khấu một cách ngây thơ thì Salesforce thắng rõ ràng (10.4:1, LTV $624k). Giữ suy nghĩ đó lại đã.

## 4.5 Bốn giả định mà dưới nó LTV nói dối

1. **Churn cố định là sai.** Churn giảm theo thâm niên — đứa nào bỏ thì bỏ sớm, đứa nào sống sót thì bám lại. Một tỷ lệ trung bình đem áp mãi mãi sẽ định giá sai tất cả mọi người. LTV trung thực là *diện tích dưới đường cong giữ chân cohort thật*, `Σ (phần còn sống ở t) × m` — công thức kia chỉ là bản xấp xỉ lười biếng của nó, và nó *tính thiếu* LTV khi đường cong đi ngang. `[established]`

2. **Không chiết khấu — và đây là chỗ hào quang của Salesforce vỡ.** Một đồng ở tháng 200 không đáng một đồng của hôm nay. Chiết khấu ở `d`:
   ```
   LTV = m × Σ [r/(1+d)]ᵗ = m × (1+d)/(c+d)
   ```
   **Tỷ lệ chiết khấu đơn giản là cộng thẳng vào churn dưới mẫu số** — sự chờ đợi ăn của mày như một cú churn thứ hai, lặng lẽ. Áp `d = 1%/month`:

   | | Figma | Salesforce | Mailchimp |
   |---|---|---|---|
   | LTV chưa chiết khấu | $3,280 | $624,000 | $411 |
   | LTV chiết khấu @1%/mo | ~$2,366 | ~$210,000 | ~$356 |
   | **Bị cắt do giá trị thời gian** | **−28%** | **−66%** | **−13%** |
   | LTV:CAC sau chiết khấu | 3.9:1 | **3.5:1** | 4.0:1 |

   Nhìn xem chuyện gì xảy ra: **con quái vật 10.4:1 và con cá con 4.6:1 đều sụp về ~3.5–4:1 một khi mày tôn trọng giá trị thời gian.** Churn càng thấp thì càng nhiều "LTV" của mày nằm ở tít mấy thập kỷ sau, và chiết khấu cắn càng đau — Salesforce mất hai phần ba giá trị vào tay cái đồng hồ. LTV chưa chiết khấu *nịnh một cách có hệ thống các doanh nghiệp churn thấp*, mà đó lại đúng là loại đang bán câu chuyện cho mày. `[established — dạng (1+d)/(c+d) là bản gọn mà hầu hết mấy slide chẳng bao giờ trưng ra]`

3. **ARPA phẳng là sai.** Có expansion (mở rộng — NRR > 100%) thì biên đóng góp *lớn dần* theo vòng đời; nếu expansion vượt churn+chiết khấu thì công thức ngây thơ chạy tới vô cực — mà đó *chính là* lý do các doanh nghiệp dẫn dắt bằng expansion được định giá khác hẳn (→ M3). NRR 125% của Salesforce nghĩa là đường cong thật của nó cong *lên*; Mailchimp 95% thì cong *xuống*.

4. **Bản thân chỉ số này còn tranh cãi.** `[contested]` LTV:CAC là một *dự báo đội lốt sự thật* — nó dựa trên một cú đoán churn về một tương lai mày chưa sống qua (tàn khốc với các công ty non chưa có cohort dài) và bị gian lận dễ như bỡn. Dân vận hành sắc sảo dẫn đầu bằng **CAC payback** (chỉ tính tiền đã thu về) và **đường cong cohort**, coi LTV:CAC như một cú kiểm tra định hướng, không bao giờ là mục tiêu. (Lemkin; các bài phê bình chỉ số của a16z.)

## 4.6 Vậy trường hợp nào "tốt nhất"? — cái đích của việc chạy cả ba
- **Theo tỷ lệ:** Salesforce (trước chiết khấu). **Theo payback/tiền mặt:** Mailchimp (hồi vốn trong 3.7 tháng). **Theo độ bền:** Salesforce (churn 0.5%). **Theo giá trị tuyệt đối mỗi khách:** Salesforce, hơn 1,000×. **Theo hiệu quả vốn:** Figma (tự nuôi mình, Chương 3).
- Không một chỉ số đơn lẻ nào phong vương được. Cái payback đẹp mê của Mailchimp giấu một cái xô thủng (6% mỗi tháng = ~52%/năm — cứ hai năm mày phải thay mới cả tệp khách). Cái tỷ lệ đẹp mê của Salesforce giấu một cái hố tiền 19 tháng và một giá trị mà phần lớn chỉ là ảo ảnh của chiết khấu. Figma là kẻ cộng dồn thầm lặng. **Đây chính là toàn bộ lý do phải giữ đủ ba trường hợp: bất kỳ chỉ số nào, đọc một mình, đều nói dối — và nó nói dối theo kiểu khác nhau cho mỗi hình dáng.**

## Chốt đi
Một trưởng nhóm tăng trưởng mang tới cho mày một kênh: **LTV:CAC 6:1 — vượt xa mốc 3:1, đổ tiền vào thôi.** Trước khi đọc tiếp: *mày hỏi gì trước khi duyệt thêm một đồng nào?*

Ba câu hỏi tháo tung nó ra hoặc xác nhận nó. **CAC nào?** Nếu con 6 đó dùng *blended* CAC, thì cái kênh trả tiền mà mày thật sự sẽ scale có khi chỉ là 2:1 — con 6 đó là organic đi mượn, sẽ không vặn to lên được khi mày tiêu tiền. **Đã chiết khấu chưa?** Một con 6:1 trên tệp churn thấp có thể rụng một nửa khi mày tôn trọng giá trị thời gian, vì phần lớn "giá trị" đó nằm ở mấy năm sau (§4.5). **Churn nào?** Với một công ty non, cái churn nằm trong LTV đó là một *cú đoán* về một tương lai nó chưa sống qua; chỉ một cohort tệ là tỷ lệ lộn ngược. Cái duyệt trung thực chẳng dựa vào tỷ lệ chút nào — nó dựa vào **CAC payback** (tiền mày *đã* thu về) và **đường cong cohort** (§4½). Rót vào cái payback, đừng rót vào dự báo.
</script>

<script type="text/markdown" id="content-M1-5">
<p class="kicker">M1 · Chương 5</p>

# Cấu trúc chi phí, điểm hòa vốn, và đòn bẩy vận hành

Hai công ty bán cùng một sản phẩm y hệt, cùng một giá y hệt, kinh tế trên đầu mỗi khách hàng y hệt — vậy mà khi lên quy mô, một thằng in tiền còn thằng kia mắc kẹt quanh điểm hòa vốn (breakeven) mãi mãi. Chẳng có gì ở *cái đơn vị* giải thích nổi chuyện đó. Khác biệt nằm ở **cấu trúc chi phí**, và đó là lý do vì sao câu "chỉ cần bán nhiều hơn thôi" cứu được doanh nghiệp này nhưng làm phá sản doanh nghiệp kia. Cái trực giác rằng lợi nhuận tăng đều theo doanh thu — bán nhiều hơn 20% thì lời thêm 20% — sai theo *cả hai* chiều, và chương này dạy mày đọc ra một doanh nghiệp sẽ bẻ về hướng nào *trước khi* mày lên quy mô nó, khi mà câu trả lời còn rẻ để hành động.

Mọi thứ xoay quanh một phép chia đôi. **Chi phí biến đổi** (variable cost) nhúc nhích theo mỗi lần bán thêm — với SaaS: hosting, phí thanh toán, phút hỗ trợ, chi phí biên để phục vụ thêm một tài khoản. **Chi phí cố định** (fixed cost) trong ngắn hạn không nhúc nhích theo lần bán tiếp theo — phần lớn lương R&D, chi phí quản lý chung, cái nền tảng mà mày vẫn phải chạy dù có 10 khách hay 10,000 khách. Đây không phải chuyện học thuật kế toán chẻ sợi tóc; đây là cái bản lề cả chương này xoay quanh, vì **chính chi phí cố định là thứ khiến lợi nhuận và doanh thu tách rời nhau ra.**

**Hệ quả thứ nhất — điểm hòa vốn.** Mỗi lần bán tạo ra một khoản *đóng góp* của nó (doanh thu trừ chi phí biến đổi của nó — cái $82/mo ở Ch4). Nhưng chi phí cố định thì mày gánh dù có bán hay không, nên mỗi tháng mày bắt đầu ở dưới một cái hố sâu bằng đúng chi phí cố định, và biên đóng góp (contribution margin) của từng đơn vị lấp dần cái hố đó. Con số phải leo để thoát hố là bị ép ra, không phải học thuộc:
```
Breakeven units = Fixed costs / Contribution per unit
```
Figma gánh **$200k/mo** chi phí cố định: 200,000 / 82 ≈ **2,440 accounts** chỉ để về mốc 0. Dưới mốc đó mày lỗ bất kể mỗi đơn vị trông đẹp đến đâu; trên mốc đó, mỗi tài khoản tăng thêm đổ trọn **$82** thẳng xuống dòng cuối — cái khoản cố định đã trả xong rồi.

**Hệ quả thứ hai — đòn bẩy vận hành.** Chính câu vừa rồi là câu làm thay đổi chiến lược. Qua khỏi điểm hòa vốn, chi phí cố định không tăng theo doanh thu, nên lợi nhuận tăng *nhanh hơn* doanh thu. Figma ở 3,000 accounts: `(3,000 × 82) − 200,000 = `**$46,000/mo**. Tăng số tài khoản đúng **+20%** lên 3,600: `(3,600 × 82) − 200,000 = `**$95,200** — lợi nhuận nhảy **+107%** từ một cú tăng doanh thu chỉ một phần năm, mà chẳng đổi gì ở sản phẩm hay ở đơn vị cả. Cái khuếch đại đó là đòn bẩy vận hành, và nó chạy *cả hai chiều*: doanh thu rớt 20% cũng sẽ băm nát lợi nhuận đúng kiểu tàn bạo như vậy. Đòn bẩy cao là một cái cần gạt không có phanh — huy hoàng khi trên quy mô, tàn khốc khi dưới nó. `[established-as-finding]`

**Dân vận hành thực sự chơi ván này thế nào.** Cấu trúc chi phí là một **canh bạc chiến lược, không phải tai nạn.** Salesforce chạy *nặng chi phí cố định* (đội bán hàng đắt đỏ, kỹ sư bán hàng) — xấu xí khi dưới quy mô, ngoạn mục khi trên nó, đó đúng là lý do nó là một canh bạc kiểu venture: mày bỏ tiền nuôi lỗ để *mua* lấy cái đòn bẩy. Mailchimp chạy *nhẹ chi phí cố định* (tự phục vụ, không đội bán hàng) — có lời sớm, nhưng trần thấp hơn. Chẳng cái nào "đúng"; chúng là những canh bạc khác nhau về chuyện khối lượng sẽ rơi vào đâu. `[synthesis]` Cái câu mà hội đồng quản trị nào cũng nói lúc suy thoái — "**con đường tới lợi nhuận**" — nghĩa đen chính là cái này: còn bao nhiêu đơn vị nữa thì lấp xong cái hố cố định, và một khi vượt qua thì lợi nhuận bẻ lên mạnh cỡ nào. Và cái dấu hiệu cần canh: một công ty còn lỗ xa dưới điểm hòa vốn mà lại rao "**contribution-margin dương!**" cho ra vẻ khỏe mạnh trong khi cái hố chi phí cố định vẫn không đáy — biên-đóng-góp-dương và *có lời* là hai hành tinh khác nhau, và khoảng cách giữa chúng chính là cái chi phí cố định chẳng ai đưa lên slide.

Nằm dưới tất cả: **gross margin là số phận.** `[heuristic]` Nó là phần còn lại của mỗi đồng doanh thu sau khi trừ chi phí biến đổi — nhiên liệu phải trang trải *mọi* chi phí cố định mà vẫn còn dư ra lợi nhuận. Phần mềm gross margin cao (80%+) có thể gánh nổi R&D nặng, bán hàng nặng, mà vẫn thắng; một doanh nghiệp gross margin thấp thì đã đói ngay trước khi chi phí cố định kịp lộ diện. Đó là cái bẫy giá-rẻ + hỗ-trợ-nặng gói gọn trong một dòng: chất đống hỗ trợ bằng con người vào COGS thì mày bóp chết chính cái biên lẽ ra dùng để nuôi tăng trưởng — đó là lý do Mailchimp *bắt buộc* phải giữ mức gần-như-không-đụng-tay mới giữ nổi 85%.

**Rule of 40** `[heuristic]`: growth% + profit-margin% > 40 — một câu tốc ký thô của thị trường về cái đánh đổi tăng-trưởng-vs-biên mà giờ mày thực sự có thể lý luận được (Chương 6), chứ không chỉ đọc vẹt.

### Chốt đi
Hai doanh nghiệp SaaS, cả hai đều **doanh thu $5M và cả hai đều đang lỗ.** A nặng chi phí cố định (đội bán hàng to, R&D sâu); B nhẹ chi phí cố định (thuần tự phục vụ). Hôm nay lỗ như nhau. Trước khi đọc tiếp: *mày muốn sở hữu cái nào khi bước vào giai đoạn tăng trưởng — và cái nào khi bước vào suy thoái?*

Vào tăng trưởng thì mày muốn **A**: khoản lỗ của nó là cái giá của đòn bẩy, và một khi vượt điểm hòa vốn thì lợi nhuận bẻ lên dữ dội — khoản lỗ đó là một khoản đầu tư vào độ dốc. Vào suy thoái thì mày muốn **B**: chi phí cố định ít nên nó vốn đã ngồi sát điểm hòa vốn rồi, không thể bị doanh thu rớt đè bẹp, còn đòn bẩy của A chạy ngược lại và chính cái khoản cố định lẽ ra làm nó giàu giờ dìm chết nó. Cùng một báo cáo kết quả kinh doanh *y hệt* mà hàm ý hai canh bạc ngược nhau — tùy vào đúng cái thứ mà bảng P&L không cho mày thấy: **chi phí nằm cố định ở đâu.** Đọc ra được cái đó chính là thứ chương này mua cho mày.
</script>

<script type="text/markdown" id="content-M1-6">
<p class="kicker">M1 · Chương 6</p>

# Giá trị thời gian và nhập môn định giá

Mọi thứ trong M1 đều dồn về đúng một câu hỏi mà một người chủ, một hội đồng, hay một bên mua thực sự đặt ra: **cái này đáng giá bao nhiêu?** Đa số người trả lời câu đó bằng một con số họ không hiểu — *"đây là một doanh nghiệp 10× ARR"* — cứ như cái bội số là một sự thật đóng dấu lên công ty chứ không phải một **canh bạc** mà ai đó đang đặt về tương lai của nó. Nó không phải sự thật. Chương này chỉ cho mày thấy cái cỗ máy nằm dưới mọi phép định giá, để khi một founder hay một banker phang cho mày một con bội số, mày hỏi được đúng cái câu duy nhất đáng hỏi — *cái gì phải đúng về tương lai thì con số đó mới đứng, và nó có đúng không?* Phần toán chỉ là một ý duy nhất (một đồng ở tương lai đáng giá ít hơn một đồng bây giờ) áp không khoan nhượng; phần phán đoán là biết con số đó đang ngầm giả định cái gì.

**Giá trị thời gian của tiền.** Một đồng hôm nay hơn một đồng năm sau — đồng hôm nay đem đầu tư được. Chiết khấu dòng tiền tương lai về để so sánh: `PV = FV / (1+d)ⁿ`. `[established]` Vẫn cái `d` đã đánh thuế lên LTV ở Chương 4, giờ áp cho cả một công ty.

**Dòng tiền chiết khấu (DCF).** Một doanh nghiệp đáng giá bằng giá trị hiện tại của toàn bộ dòng tiền tương lai về tay chủ: `Value = Σ FCFₜ / (1+d)ᵗ`. Với một dòng tiền tăng trưởng ổn định, cái này rút gọn thành **Gordon growth**: `Value = FCF_next / (d − g)`. Nguy hiểm: khi `g → d`, giá trị nổ tung — chỉnh nhẹ giả định tăng trưởng là định giá đảo điên, đó là lý do người ta *cãi nhau* về DCF chứ không *tin* nó. `[established]`

**Vì sao SaaS được định giá theo bội số doanh thu.** SaaS còn non thì tiền hiện tại ít, nên DCF của tiền *hôm nay* ra gần bằng 0. Thị trường định giá *tương lai* qua một **bội số doanh thu** ("10× ARR") — thực chất là một DCF nén lại: cao khi tăng trưởng, retention (NRR), và biên đều cao. `[synthesis — established underneath]`

> **Ba ca nhận ba bội số — và không phải cái tỷ số quyết định.** Salesforce nắm bội số *cao nhất* dù payback 19 tháng, vì 125% NRR và 0.5% churn khiến tương lai của nó gần như chắc chắn — thị trường trả tiền cho độ bền. Mailchimp lãnh bội số *thấp nhất* dù payback nhanh nhất, vì churn 6%/tháng chặn trần giá trị cuối kỳ (terminal value) — mày không thể xây một thập kỷ tích lũy trên một cái thùng cứ hai năm lại cạn sạch. Figma nằm giữa. **Tốc độ payback thắng cho mày tiền mặt; retention thắng cho mày cái bội số.** Đó là câu mà cả M1 tồn tại để giành cho được.

**Sợi chỉ xuyên suốt M1:** unit economics (Ch 4) → gộp thành P&L và đòn bẩy (Ch 5) → dòng tiền tương lai chiết khấu (Ch 6). Giá trị doanh nghiệp chẳng qua là unit economics, đem nhân lên rồi chiết khấu. Mọi cần gạt mà phần còn lại của chương trình dạy — retention, định giá bán, tăng trưởng — đều là cần gạt lên *chính* con số này.

### Chốt đi
Hai công ty SaaS, cùng **$10M ARR, cùng tốc độ tăng trưởng.** Một banker định giá Công ty X là **12× ARR** còn Công ty Y là **4×**. Trước khi đọc tiếp: *con số duy nhất nào nhiều khả năng giải thích khoảng cách 3× đó — và mày sẽ kiểm cái gì để biết phần bù giá của X là xứng đáng hay là bong bóng?*

Gần như chắc chắn là **retention (NRR)** — không phải tăng trưởng, không phải biên. Con 12× của X nói thị trường tin doanh thu của nó *bền*: một nền đang tăng giá trị, tự tích lũy mà chẳng cần bán thêm mấy (NRR > 120%). Con 4× của Y nói cái nền của nó rỉ, nên mỗi đồng tương lai đều phải đi giành lại (NRR < 100%). Để kiểm phần bù giá có thật hay không, mày đừng chằm chằm nhìn cái bội số — mày nhìn xuống **đường cong cohort và net revenue retention** nằm dưới nó, vì cái bội số chính là mấy thứ đó nén lại thành một con số. Tốc độ payback thắng cho mày tiền mặt; retention thắng cho mày cái bội số — và một bội số mua bằng một câu chuyện retention chẳng ai kiểm chứng thì đó đúng là cách bong bóng định giá.
</script>

<script type="text/markdown" id="content-M1-7">
<p class="kicker">M1 · Tự kiểm tra</p>

# Tự kiểm tra — mày có *dùng* được nó không, hay chỉ nhận ra nó?

Làm hết trước khi mở lời giải — điểm mấu chốt là *làm* toán, không phải đọc toán. Chúng được **trộn lẫn có chủ đích**: mỗi bài bắt mày trước hết phải quyết *công cụ nào* mới hợp, đó mới là kỹ năng thật (một bài tự khai ra công thức của nó thì chẳng kiểm được gì). Và trước khi dò bất kỳ đáp án nào, **ghi lại độ tự tin (0–100%) cho mỗi bài.** Khoảng cách giữa mức mày thấy chắc chắn và mức mày thực sự làm được là một tín hiệu sắc hơn cả điểm số để biết phải học lại cái gì.

**P1.** Một SaaS tính phí theo tháng: ARPA $50, gross margin 75%, churn tháng 4%, CAC $500. Tính contribution, lifetime, LTV, LTV:CAC, payback. Khỏe không?

**P2.** Cùng doanh nghiệp đó, suất chiết khấu tháng 1.5%. LTV chiết khấu, và % bị cắt so với chưa chiết khấu?

**P3.** Chi phí cố định $120,000/mo. Số accounts hòa vốn? Lợi nhuận vận hành ở 4,000 accounts? Nếu số accounts tăng 15%, lợi nhuận vận hành đổi bao nhiêu %?

**P4.** Hai doanh nghiệp có LTV:CAC y hệt 4:1. Một cái (như Salesforce) churn tháng 0.5%; cái kia (như Mailchimp) là 6%. Sau khi chiết khấu ở 1%/mo, LTV:CAC của cái nào rớt nhiều hơn, và vì sao? Điều đó hàm ý gì về chuyện cái nào xứng bội số định giá cao hơn?

**P5.** Một cohort khởi đầu ở $200k MRR. Qua một năm nó mất $30k vì churn, $10k vì contraction, và được thêm $50k từ expansion. Tính GRR và NRR. Với zero khách hàng mới, cohort đang lớn lên hay teo lại?

**P6.** Mày gọi vốn $3M ở mức định giá pre-money $12M. Post-money là bao nhiêu, nhà đầu tư sở hữu bao nhiêu %, và — nếu trước đó mày giữ 70% — sau vòng này phần của mày còn bao nhiêu?

**P7 · bẫy — công cụ hiển nhiên lại là công cụ sai.** Một founder khoe: *"Blended CAC $40, LTV $1,200 — cỗ máy 30:1. Gọi vốn rồi dồn hết vào paid growth thôi."* Mày đào sâu: ~90% lượt đăng ký đến từ một vòng lặp giới thiệu lan truyền vốn đã chậm lại, và CAC **paid** là **$600**. Hành động dựa trên con 30:1 thì sai ở đâu — và con số nào mới thực sự quyết định chuyện họ có scale được không?

**P8 · phán đoán — không có đáp án chuẩn.** Mày chỉ được rót vốn cho đúng một trong hai công ty SaaS, cùng giá. **A:** churn 8%/mo, nhưng **200% NRR** nhờ một *vài* con cá voi mở rộng nhanh; payback 2 tháng; tự nuôi thân. **B:** churn 1%/mo, **102% NRR** trải đều trên một nền rộng; payback 14 tháng; cần gọi thêm một vòng nữa. Dữ liệu không phong vương cho ai. Ra quyết định, gọi tên **một biến số** đã dẫn tới nó, nói điều gì sẽ khiến mày đổi phe, và biện hộ hết mình cho công ty mày đã loại. *(Chấm theo lập luận, không theo lựa chọn.)*
</script>

<script type="text/markdown" id="content-M1-8">
<p class="kicker">M1 · Lời giải & phản hồi</p>

# Lời giải, phản hồi & sản phẩm đầu ra

## Lời giải

**S1.** Contribution `50×0.75 = $37.50`. Lifetime `1/0.04 = 25 mo`. LTV `37.5/0.04 = $937.50`. LTV:CAC `1.9:1`. Payback `500/37.5 = 13.3 mo`. **Không khỏe:** tỷ số dưới 3:1 và mỗi khách hàng phơi tiền 13 tháng — nhiều khả năng là vấn đề churn (4%/mo = đời 25 tháng). *Nếu mày ra ~2.5:1 rồi gọi là khỏe, thì gần như chắc chắn mày đã lấy doanh thu ($50) thay vì contribution ($37.50) đút vào LTV — đây là lỗi unit-economics phổ biến nhất; LTV luôn chạy trên contribution, luôn luôn.*

**S2.** LTV chiết khấu `= 37.5 × (1.015/(0.04+0.015)) = 37.5 × 18.45 ≈ $691.9`. Phần cắt `1 − 691.9/937.5 ≈ 26%`.

**S3.** Hòa vốn `120,000/37.5 = 3,200`. Ở 4,000: `(4,000×37.5) − 120,000 = $30,000`. Ở 4,600 (+15%): `(4,600×37.5) − 120,000 = $52,500`, **+75%**. Đòn bẩy vận hành.

**S4.** Cái **churn thấp** (kiểu Salesforce) rớt nhiều hơn: giá trị của nó nằm xa tít trong tương lai, nên chiết khấu cắn mạnh hơn — mẫu số `(1+d)/(c+d)` của nó đi từ 0.005 lên 0.015 (×3), so với cái churn cao đi từ 0.06 lên 0.07 (×1.17). Trái với trực giác, doanh nghiệp *dính hơn* lại mất nhiều LTV vì chiết khấu hơn — **nhưng vẫn xứng bội số cao hơn**, vì churn thấp nghĩa là tiền của nó gần như chắc chắn và tích lũy qua nhiều năm; cú cắt do chiết khấu là một lần định giá lại, còn độ bền thì kéo dài mãi.

**S5.** GRR `= (200 − 30 − 10)/200 = 80%`. NRR `= (200 − 30 − 10 + 50)/200 = 105%`. **Đang lớn** — NRR trên 100% nghĩa là expansion vượt qua các khoản mất, nên cái nền tự tích lũy dù không có logo mới nào.

**S6.** Post-money `= 12 + 3 = $15M`. Nhà đầu tư `= 3/15 = 20%`. Phần của mày `= 70% × (1 − 0.20) = 56%`.

**S7 (bẫy).** Con 30:1 cưỡi trên CAC **blended** bị chi phối bởi một vòng lặp lan truyền vừa *đang bão hòa* vừa *không mua được* — mày không thể "dồn tiền vào" cái organic. Con số quyết định chuyện scale là **paid CAC = $600**, tức LTV:CAC ≈ **2:1**, dưới mức chuẩn. Cứ đổ tiền vào thì cái blend sẽ tụt dần về đúng kinh tế của paid khi kênh miễn phí cạn. *Nếu mày cầm con 30:1 tin luôn thì mày đã dính đúng cái bẫy "CAC nào?" ở Ch4 — công cụ thì đúng; đầu vào mới là lời nói dối.*

**S8 (phán đoán — không đáp án chuẩn, có chủ đích).** Một câu trả lời mạnh *nhìn ra cái mà mỗi con số đang giấu*: 200% NRR của A là **rủi ro tập trung** (vài con cá voi — mất một con là sập, với 8% churn đang cháy bên dưới), còn 102% của B thì bền và rộng nhưng chậm và ngốn vốn. Nó gọi tên được một biến số quyết định (*tập trung cá voi vs. độ bền*), một điều kiện đổi phe (*"nếu expansion của A đến từ <5 accounts, tao chuyển sang B"*), và biện hộ hết mình cho cái bị loại. Một câu trả lời yếu chỉ chọn NRR-cao-hơn hoặc churn-thấp-hơn mà không thấy rủi ro ẩn. Không lựa chọn nào "đúng" — chỉ có lập luận sống sót nổi trước phản biện mạnh nhất của chính nó.

**Giờ đối chiếu ghi chú độ tự tin với kết quả của mày.** Chỗ mày *tự tin mà sai* là chỗ cơ chế chưa bao giờ thực sự thấm — đọc lại phần **suy dẫn** của chương đó, không phải công thức. Chính cái khoảng cách đó, không phải điểm thô, mới là danh sách học lại của mày.

## Sản phẩm đầu ra

**Một dashboard Unit Economics + P&L + Định giá** (bảng tính), lý tưởng là bày cả ba ca cạnh nhau: CAC ba kiểu, contribution, churn, lifetime, LTV chưa chiết khấu *và* đã chiết khấu, LTV:CAC, payback; một bảng P&L kiểu contribution-margin xuống tới lợi nhuận vận hành có gross margin và điểm hòa vốn; một phân tích độ nhạy đòn bẩy vận hành (±20% khối lượng); và một dòng định giá (ARR × một bội số có bảo vệ được, đối chiếu chéo với Rule of 40). Khi mày bảo vệ được từng ô — và giải thích được vì sao ba ca lại rẽ nhánh khác nhau — thì M1 xong.

# Bookings, billings, revenue & ARR — bốn con số người ta hay lẫn

Mày tưởng một công ty có *một* con số doanh thu — một con số thành thật cho "nó kiếm được bao nhiêu tiền." Không hề. Một hợp đồng ký duy nhất nhả ra **bốn** con số "tiền" khác nhau, có thể gấp ba hay gấp mười lần nhau, tất cả về mặt kỹ thuật đều đúng, và *con số nào được đem ra đọc cho mày nghe là một lựa chọn* — có lúc vô tội, có lúc là một cú lừa. Học cách đòi cho ra là con số nào, mày thôi làm khán giả ngồi xem một câu chuyện tăng trưởng được dàn dựng; bỏ lỡ nó thì một doanh nghiệp đang lặng lẽ chảy máu tiền có thể trông như một tên lửa. Đây là cả bộ, từ một sự kiện. `[established]`

- **Booking** — tổng giá trị hợp đồng đã ký (TCV). Một hợp đồng Salesforce 2 năm ở mức $48k/năm là một **booking $96k** ngay ngày ký.
- **Billing** — cái mày thực sự xuất hóa đơn trong kỳ. Thu theo năm, billing Ngày-0 của Salesforce là **$48k**, không phải $96k.
- **Revenue** — cái mày *kiếm được* trong kỳ theo dồn tích/GAAP. Salesforce kiếm **~$4,000/tháng**, ghi nhận đều đặn khi dịch vụ được giao.
- **ARR / MRR** — *run-rate doanh thu định kỳ* năm/tháng: một ảnh chụp đã quy về năm tại một thời điểm. Hợp đồng này thêm **$48k ARR**. Nó là một con trỏ hướng về tương lai, **không phải** doanh thu GAAP.

### Cùng một sự kiện, bốn con số (Salesforce ký hợp đồng 2 năm, ngày 1/1)

| Chỉ số | Giá trị | Nó đo cái gì |
|---|---|---|
| Bookings | $96,000 | Tổng đã ký hợp đồng (TCV) |
| Billings | $48,000 | Xuất hóa đơn bây giờ (theo năm) |
| Revenue (Tháng 1) | $4,000 | Kiếm được tháng này |
| ARR thêm vào | $48,000 | Run-rate định kỳ |

**Khoảng cách giữa billings và revenue chính là doanh thu chưa thực hiện** (Chương 2). Khoảng cách giữa bookings và billings là phần hợp đồng tương lai, chưa thu. `[established]`

> **Chỗ nó cắn.** Bookings có thể bị thổi phồng bằng cách nhồi TCV nhiều năm vào một quý. ARR có thể gồm cả những logo sắp churn. Một công ty có thể lớn "ARR" trong khi doanh thu GAAP và tiền mặt lết theo thảm hại. Khi ai đó đọc cho mày một con số, hỏi *con số nào* — và ba con số kia có khớp không. Cái khoảng cách giữa chúng là nơi cả sự nhầm lẫn thành thật lẫn sự dối trá lặng lẽ trú ngụ.

### Chốt đi
Deck của một startup mở màn bằng **"$10M ARR, tăng 3× năm nay."** Mày đang cân nhắc có gia nhập không. Trước khi đọc tiếp: *mày hỏi ba con số nào, và cái gì sẽ biến $10M đó thành ảo ảnh?*

Hỏi **doanh thu GAAP** — nếu nó là $3M so với $10M ARR, phần lớn cái run-rate đó là mới-giao-lèo-tèo hoặc vừa-mới-ký, là kỳ vọng chứ không phải thành tích đã có. Hỏi **billings và tiền đã thu** — nếu ARR gấp ba mà tiền không gấp ba, họ đang ghi những hợp đồng chưa được trả tiền. Hỏi **net revenue retention** — nếu ARR gồm cả những logo đã phát tín hiệu churn, thì $10M của năm sau rò ra ngoài trước khi có một cú bán mới nào đáp xuống. ARR là con số được đọc nhiều nhất và ít phải chịu trách nhiệm nhất trong bốn con số, chính vì nó là một *con trỏ hướng tương lai mà chưa ai phải giao hàng cả*. Con số trên slide chưa bao giờ là câu hỏi; câu hỏi là ba con số kia có khớp với nó không.

Chuyển động MRR/ARR phân rã thành **mới + mở rộng − co lại − churn** — đúng toàn bộ chủ đề của chương retention (§4½), nơi con số cuối cùng đó quyết định liệu tệp khách gộp lãi hay chảy máu.

# Cohort, giữ chân, và hai con số quyết định số phận của mày

## Cất công làm gì — sai lầm đắt nhất trong cả module

Ở Chương 4 mày dựng LTV, và tao đã lén tuồn qua mày một câu: *một tỷ lệ churn trung bình duy nhất là nói dối.* Đó là câu đắt nhất trong M1, và đây là nơi mày cảm được tại sao — vì cái sai lầm nó chỉ ra không phải chuyện hàn lâm. Nó chính xác là cái lỗi khiến một công ty gọi được vốn nhờ một câu chuyện đẹp, đổ hàng triệu đô vào giành khách, rồi hai năm sau phát hiện ra suốt thời gian đó nó chỉ đang châm nước vào một cái xô thủng.

Đặt quyết định lên bàn. Mày sắp nói với hội đồng — hoặc với chính mày — *"một khách đáng giá $X, nên trả $Y để có được một khách là một cú trao đổi ngon."* Cả cái tuyên bố đó dựa hết vào một đại lượng ẩn: **khách thật sự ở lại bao lâu, và trả bao nhiêu trong lúc còn ở đây.** Đoán sai đại lượng đó thì mọi thứ ở hạ nguồn — LTV, LTV:CAC, mày dám tiêu bao nhiêu để giành khách, gọi bao nhiêu vốn, công ty đáng giá bao nhiêu — đều sai *cùng một hướng*, lặng lẽ, suốt nhiều năm. Chẳng ai gửi cảnh báo cả. Cái xô cứ thế không bao giờ đầy.

Nên chương này xứng đáng với độ dài của nó. Nó dựng cái công cụ duy nhất đo được sự sống sót một cách trung thực — **cohort** — rồi hai con số, **GRR** và **NRR**, biến "khách ở lại" thành đồng đô la và quyết định, hơn gần như bất cứ thứ gì khác, chuyện doanh nghiệp mày cộng dồn hay chảy máu.

## Chỗ mà số trung bình đi sai

Mày phải cảm được vì sao cách làm dễ dãi kia sai đã, thì cách sửa mới có nghĩa.

Dashboard của mày báo: *churn tháng 5%.* Một con số cho cả công ty. Nó có cảm giác như tri thức. Thực ra nó gần với ngụy trang hơn — vì con 5% đó bình quân hóa hai nhóm dân số không thể nào khác nhau hơn. Trong đó có những người đăng ký tuần trước, nhiều đứa thử sản phẩm một lần, không hiểu nó, rồi biến mất trong vòng một tháng. Trong *cùng* cái trung bình đó là những người đã trả tiền mỗi tháng suốt ba năm, đã cắm sản phẩm vào đời sống hàng ngày của cả team và gần như không bao giờ rời đi. Trộn chúng lại và mày được một con số chẳng mô tả **ai cả**: nó phóng đại tốc độ rời đi của phần lõi trung thành và hạ thấp tốc độ rời đi của đám vừa đăng ký.

Tệ hơn, cái tỷ lệ trung bình đó *dịch chuyển vì những lý do chẳng liên quan gì tới giữ chân.* Đổ vào một đợt sóng đăng ký mới thì "tỷ lệ churn" của mày giật nảy — vì mày đã đổi *cơ cấu*, không phải lòng trung thành. Mày không thể sửa cái giữ chân mà mày không nhìn thấy, và một tỷ lệ trung bình được sinh ra để giấu đúng cái thứ mà mày cần thấy nhất: **khách hành xử khác nhau tùy vào việc họ đã sống sót được bao lâu rồi.**

## Dựng cái cách sửa: cohort thực ra là gì

Đây là nước đi, và nó gần như đơn giản đến ngượng một khi mày thấy nó.

Ngừng lấy trung bình trên tất cả mọi người. Thay vào đó lấy **một nhóm khách hàng cùng bắt đầu trong một kỳ** — chẳng hạn, *tất cả những người đăng ký trong tháng Một* — và từ giờ chỉ theo dõi *đúng nhóm đó.* Mày không bao giờ thêm ai vào nó nữa. Cái nhóm bị đóng băng đó là một **cohort.**

Đóng băng để làm gì? Đó là toàn bộ mẹo. Vì nhóm không bao giờ nhận thêm thành viên mới, nên bất cứ chuyện gì xảy ra với nó từ đây trở đi đều là **giữ chân thuần túy** — không có đám đăng ký mới nào tràn vào để tô đậy các tổn thất. Nếu tháng Một khởi đầu với 1,000 khách và 880 còn lại vào tháng Ba, mày biết một điều đúng và không bị nhiễm bẩn: lớp này giữ được 88% tới tháng thứ ba của nó. Không hiệu ứng cơ cấu, không ngụy trang. Một lớp, quan sát khi nó tốt nghiệp — hoặc rơi rụng — từng tháng một:

```
Tháng 0 (Tháng Một):   1,000 khách   — 100% của cohort
Tháng 1 (Tháng Hai):     920 còn lại  —  92%
Tháng 2 (Tháng Ba):      880 còn lại  —  88%
Tháng 3 (Tháng Tư):      855 còn lại  —  85.5%
```

Để ý *cái* ta đang đo: không phải thời gian theo lịch, mà là **tuổi** — số tháng kể từ khi *chính khách đó* bắt đầu. Cái chuyển đổi ấy, từ "chuyện gì xảy ra trong tháng Ba" sang "chuyện gì xảy ra với một khách ở tháng thứ ba của họ," chính là toàn bộ chìa khóa. Giữ lấy nó, vì thuật ngữ tiếp theo được dựng thẳng lên trên nó.

## Từ cohort tới đường cong cohort — và tại sao hình dáng của nó là cả ván bài

Giờ làm cái việc hiển nhiên tiếp theo: vẽ cái cột phần-còn-sống đó lên. Tháng 0 ở 100%, tháng 1 ở 92%, tháng 2 ở 88%, và cứ thế khi cohort già đi. Nối các điểm lại và mày có một đường — **đường cong cohort** (còn gọi là đường cong giữ chân).

Đường cong cohort *chỉ* có thế: **sự sống sót của một cohort, vẽ theo tuổi.** Nếu "cohort" nghe như một từ mới bốn đoạn trước, thì "đường cong cohort" giờ nên nghe chẳng có gì mới cả — vẫn nhóm người đó, chỉ là đem vẽ lên đồ thị. (Cái cây cầu đó chính là thứ một tờ cheat-sheet bỏ qua, và bỏ qua nó là cách một thuật ngữ bị quăng vào mặt mày như thể mày đã biết sẵn rồi.)

Đây là tại sao đường cong, chứ không phải số trung bình, quyết định vận mệnh — cái **hình dáng.** Mô hình trung-bình lặng lẽ giả định rằng giữ chân là một *phần trăm cố định mỗi tháng* — mất 5% của bất kỳ ai còn lại, mãi mãi. Vẽ ra thì đó là một cú trượt hàm mũ mượt mà về không. Nhưng khách hàng thật gần như không bao giờ làm vậy. Đường cong cohort thật thì **đi ngang**: chúng rớt dốc lúc đầu — khách không hợp, đám thử cho vui, đám đăng ký sai phân khúc bỏ đi sớm — rồi độ dốc dịu lại, vì những người còn đứng vững sau một năm là *tín đồ thật sự*, đã xây quy trình làm việc của mình quanh mày. Đường cong thôi là một cú trượt và trở thành một cái kệ.

Đặt hai cái cạnh nhau và cái được-mất bật ra:

| Tuổi (tháng) | Phẳng ngây thơ 5%/tháng | Cohort thật (đi ngang) |
|---|---|---|
| 0 | 100% | 100% |
| 3 | 86% | 84% |
| 6 | 74% | 74% |
| 12 | 54% | 63% |
| 24 | 29% | 55% |

Đọc hàng dưới cùng. Đến tháng 24, mô hình tỷ-lệ-phẳng đã xóa sổ **71%** cohort coi như mất; đường cong thật, đi ngang, vẫn còn **55%** đang trả tiền. Đó không phải chênh lệch làm tròn — nó gần như *gấp đôi* tệp còn sống sau hai năm, và nó cộng dồn vào mọi cách định giá công ty.

Giờ nối thẳng ngược về đồng tiền của Chương 4. Giá trị vòng đời thật của mày là **diện tích dưới đường cong cohort thật** (phần còn sống mỗi tháng × biên đóng góp họ trả), chứ không phải `m/c`. Công thức `m/c` *chính là* giả định tỷ-lệ-phẳng cải trang — nó vẽ cú trượt, không vẽ cái kệ. Nên hướng nói dối của nó giờ đã rõ chính xác:

> **LTV dùng churn trung bình tính thiếu giá trị của bất kỳ sản phẩm nào có đường cong đi ngang, và tính thừa bất kỳ sản phẩm nào có đường cong cứ trượt mãi.** Với một sản phẩm dính chặt, giá trị thật nằm trên cái kệ mà công thức giả vờ không có ở đó. Đây là lý do cái "giả định #1, churn cố định là sai" ở Chương 4 không phải nói suông — nó chính là cái khoảng chênh này, giờ đã vẽ ra. `[established-as-finding]`

*Nói thẳng về xuất xứ: các con số cụ thể trong bảng đó là minh họa, chọn ra để cho thấy hình dáng. Việc các đường cong giữ chân thật đi ngang chứ không phân rã ở một tỷ lệ cố định mới là phát hiện đã được xác lập vững (các bài viết về SaaS của David Skok; hầu hết dữ liệu giữ chân B2B). `[established-as-finding]` Độ đi ngang mạnh cỡ nào thì phụ thuộc điên cuồng vào từng sản phẩm — đo cái của chính mày, đừng bao giờ mượn của tao.*

## Từ "bao nhiêu người ở lại" sang "bao nhiêu đô la ở lại"

Đường cong cohort đếm *khách hàng.* Một doanh nghiệp chạy bằng *đô la*, và ở đây hai thứ tách nhau ra theo một kiểu cực kỳ quan trọng.

Lấy hai khách cùng "ở lại" năm nay — không đứa nào churn. Khách A lặng lẽ hạ cấp từ gói $500 xuống $100. Khách B mê mày và nâng cấp từ $500 lên $900. Xét theo đường cong đầu người, cả hai chỉ đơn giản là "được giữ lại", y hệt nhau. Xét theo *doanh thu*, chúng là hai sự kiện trái ngược: một đứa rò $400, đứa kia thêm $400. Một doanh nghiệp có thể giữ nguyên mọi logo mà vẫn chảy máu doanh thu, hoặc mất logo mà vẫn tăng doanh thu. Để thấy điều đó, mày đếm-giữ-chân bằng **đô la** — cái đó cho ra hai con số mà giờ hội đồng SaaS nào cũng sống với nó. Cả hai đều cuộn một tệp doanh thu hiện có tiến lên một năm, chỉ chạm vào **khách hiện có** (không có logo mới — ta đang đo giữ chân, không đo bán hàng).

**Gross Revenue Retention (GRR)** đo cái rò thuần: trong tệp doanh thu mày khởi đầu, bao nhiêu sống sót, chỉ tính *những* cách doanh thu ra đi — khách churn ra hẳn, và khách co lại (hạ cấp). Nó cố tình bỏ qua expansion.
```
GRR = (doanh thu đầu kỳ − churn − co lại) / doanh thu đầu kỳ
```
Vì nó luôn chỉ trừ đi, **GRR không bao giờ vượt quá 100%.** Nó trả lời một câu hỏi phòng thủ: *nếu ta không bán được gì mới và không ai nâng cấp, cái sàn tụt nhanh cỡ nào?* GRR 89% nghĩa là mày mất 11% tệp mỗi năm chỉ riêng vào cái rò — dòng nước mày phải bơi ngược mãi mãi.

**Net Revenue Retention (NRR)** cộng thêm cái thứ GRR bỏ đi: **expansion** — khách hiện có trả cho mày *nhiều hơn* theo thời gian (nâng cấp, thêm ghế, dùng nhiều hơn).
```
NRR = (doanh thu đầu kỳ − churn − co lại + expansion) / doanh thu đầu kỳ
```
Vì expansion có thể lớn hơn cái rò, **NRR có thể vượt 100%** — và khi nó vượt, một điều đáng kinh ngạc xảy ra.

### Ví dụ tính tay — cả hai từ một cohort
Một cohort khởi đầu năm ở **$100k MRR.** Trong năm, chỉ tính *riêng* đám khách hiện có này: **$8k** churn ra, **$3k** co lại, **$20k** expansion tới từ nâng cấp và thêm ghế.
```
GRR = (100 − 8 − 3) / 100        = 89%
NRR = (100 − 8 − 3 + 20) / 100   = 109%
```
Hai con số, một cohort, một câu chuyện hai tầng: doanh nghiệp rò 11% một năm (GRR 89% — đáng sửa), nhưng khách hiện có của nó mở rộng đủ nhanh để bù cái rò *và* làm tệp lớn thêm 9% nữa trên đó (NRR 109%).

### Tại sao NRR > 100% được gọi là chén thánh
Ngồi với cái nghĩa của NRR 109%. Ký **zero** khách mới — tắt hết sales và marketing — mà tệp hiện có vẫn *lớn lên*, như một quỹ đang tái đầu tư chính cổ tức của nó:
```
$100k → $109k → $118.8k → $129.5k     (3 năm, không khách mới)
```
Giờ tới Mailchimp ~95%, cùng cỗ máy đó chạy ngược:
```
$100k → $95k → $90.3k → $85.7k        (phân rã — mày giành khách chỉ để đứng yên tại chỗ)
```

| | Figma | Salesforce | Mailchimp |
|---|---|---|---|
| NRR | ~110% | ~125% | ~95% |
| Tệp với zero khách mới | cộng dồn chậm | cộng dồn mạnh | phân rã |

Cùng công sức sản phẩm, số phận trái ngược — và cái ngã ba hoàn toàn nằm ở chuyện NRR vượt qua vạch 100%. **NRR trên 100% là một tài sản đang lên giá; dưới 100% là một tài sản đang mất giá.** Đây là cơ chế đằng sau cái khoảng chênh định giá mày sẽ gặp ở Chương 6: Salesforce kiếm được cái bội số cao cấp của nó *ngay đây*, ở NRR 125% — không phải ở tỷ lệ CAC, cái mà ta đã thấy chỉ là ảo ảnh của chiết khấu.

## Dân vận hành thật sự dùng mấy cái này ra sao — và chúng bị gian lận thế nào

Đây là chuyện xảy ra trong phòng họp thật, vì đó là nơi con số sống.

- **NRR là *THE* con số.** Với một hội đồng hay nhà đầu tư SaaS hiện đại, nó gần như là chỉ số sức khỏe được soi nhiều nhất — có mặt trên gần như mọi bộ slide hội đồng, đóng khung thành *"cứ mỗi đô la ta có một năm trước, giờ ta còn bao nhiêu từ đúng đám khách đó?"* NRR top phần tư của B2B SaaS thường được trích quanh 120%+; dưới 100% kéo dài với một doanh nghiệp tự nhận là "định kỳ" là một hồi chuông báo động lặng lẽ. `[heuristic — benchmark, thay đổi theo phân khúc và theo năm; tự tìm cái so sánh của riêng mày]`
- **Chỗ nó bị gian lận** — phiên bản tầng-chiến-tranh của cái "mày đang bị cho xem con số nào" ở Chương 2½. Một NRR trung bình có thể được chống đỡ bằng một dúm **cá voi expansion** (vài tài khoản lớn tăng gấp đôi) trong khi khách *trung vị* lặng lẽ co lại phía dưới. "NRR" trích ra mà không nói rõ nó có trọng-số-đô-la hay theo-phân-khúc thì có thể giấu một tệp SMB đang thối rữa dưới hai cái logo doanh nghiệp vui vẻ. Cũng canh chừng NRR đo trên một tệp *bao gồm* cả doanh thu đã bị đánh dấu sẽ churn, và cái muôn thuở được ưa chuộng "NRR không tính [phân khúc mà tụi tôi chảy máu]." `[synthesis — từ cách cái động cơ khuyến khích vận hành]`
- **Cái câu vang lên trong phòng.** Câu hỏi sắc bén không phải "NRR của mình là bao nhiêu?" — mà là *"net dollar retention có trên 100% cho khách trung vị không, chứ không chỉ trọng-số-đô-la?"* Nếu có, cỗ máy tăng trưởng tự đẩy được một phần. Nếu không, mày đang chạy ngược lên một cái thang cuốn đi xuống, và mọi câu chuyện về scale thật ra là câu chuyện về việc phải giành khách ngày một rẻ hơn mãi mãi.
- **Cái cặp không giả được.** GRR và NRR *cùng nhau* mới là bức tranh trung thực: NRR 115% trên GRR 82% nghĩa là doanh nghiệp lớn lên chỉ vì vài tài khoản mở rộng dữ dội trong khi tệp rò nặng — một con thú mong manh hơn nhiều so với NRR 115% trên GRR 97%. Ai chỉ cho mày xem mỗi NRR là đang cho mày xem cái nửa nịnh nọt.

> **Kiểm tra nhanh bằng trực giác** `[heuristic]`: **quick ratio** = `(new + expansion) / (churn + contraction)`. Trên ~4, tăng trưởng hiệu quả — mày thêm vào nhiều hơn hẳn cái mất đi. Gần 1, mày đang tát nước ra nhanh ngang với nước tràn vào, và bao nhiêu đầu-phễu cũng chẳng cứu nổi cho tới khi cái rò được vá.

## Mày mang gì ra khỏi chương này
- Một **cohort** là một nhóm khách bị đóng băng cùng bắt đầu với nhau, theo dõi theo *tuổi* — cách sạch duy nhất để thấy giữ chân, vì đám đăng ký mới không ngụy trang được nó.
- **Đường cong cohort** là sự sống sót của nhóm đó vẽ theo tuổi; cái *hình dáng* của nó (đi ngang hay trượt đều) chính là thứ khiến LTV dùng churn trung bình nói dối, và nói dối theo hướng nào.
- **GRR** đo cái rò (≤100%); **NRR** cộng thêm expansion (có thể vượt 100%). NRR vượt qua 100% là ranh giới giữa một doanh nghiệp đang lên giá và một doanh nghiệp đang mất giá — và chính nó, không phải tỷ lệ LTV:CAC, kiếm được cái bội số định giá ở Chương 6.

Nếu mày chưa giải thích được cho người khác tại sao một số trung bình lại giấu đúng cái thứ mày cần thấy, đọc lại hai phần đầu — đó là cái ý chịu lực, và mọi thứ ở đây đều được dựng lên trên nó.
</script>

# Suất chiết khấu, và một ví dụ định giá làm tay

Chương 4 và 6 dựa vào một suất chiết khấu `d` mà tao đặt bừa ở 1%/tháng — và phần lớn người ta coi con số đó như một chú thích kỹ thuật. Ngược lại mới đúng: **`d` là đầu vào mạnh nhất và *gây tranh cãi* nhất trong bất kỳ phép định giá nào.** Nó là chỗ mà cùng một công ty y hệt đáng giá $10M hay $30M tùy vào đúng một giả định về rủi ro — nên ai đặt `d` thì người đó đặt luôn đáp án, và hiểu nó đến từ đâu chính là khác biệt giữa việc *tự định giá* một doanh nghiệp và việc bị *dúi* cho một con định giá bắt nuốt. Nó đến từ một ý duy nhất: cái lợi suất mà tiền của mày kiếm được ở chỗ khác với cùng mức rủi ro.

## d đến từ đâu: chi phí vốn
`d` chính là **chi phí vốn** của mày — lợi suất mà nhà đầu tư kiếm được ở chỗ khác với rủi ro ngang bằng, và do đó là cái ngưỡng mà mỗi đồng trong doanh nghiệp phải vượt qua. `[established]`

- **WACC** trộn chi phí nợ và chi phí vốn chủ theo tỷ trọng của chúng.
- **Chi phí vốn chủ**, qua **CAPM**: `rf + β × (market risk premium)`. Một công ty đại chúng với rf 4%, β 1.3, premium 5% → ~10.5%. `[established]`
- **Vì sao startup bị chiết khấu tàn nhẫn.** Rủi ro nhiều hơn → lợi suất đòi hỏi cao hơn. VC nhắm tới IRR 30–50%+; ngưỡng của một startup nằm cao hơn hẳn con ~8–10% của một công ty trưởng thành. `d` thực tế cho SaaS giai đoạn đầu là **20–40%/năm** (~1.5–2.8%/tháng) — *cao hơn* con 1% hiền lành dùng trước đó.

## Một con d thực tế làm gì với Salesforce
Salesforce: `m = $3,120`, churn `0.5%/mo`. Tính lại LTV ở `d = 2.5%/month` (~30%/yr):
```
LTV = 3,120 × (1.025 / (0.005 + 0.025)) = 3,120 × 34.2 ≈ $106,700
```
So với **$624,000 chưa chiết khấu — cắt mất 83%.** Với doanh nghiệp churn thấp, phần lớn "LTV" là một lời hứa cách đây hàng chục năm, và bất kỳ chi phí vốn trung thực nào cũng làm nó sụp. Doanh nghiệp càng dính chặt thì cái LTV giật tít của nó càng là một ảo ảnh của suất chiết khấu. `[established]`

## Một DCF làm tay → một bội số ngầm
Định giá Figma trực tiếp. Giả sử dòng tiền tự do (FCF) năm sau **$1.0M**, tăng **25%/yr** trong năm năm, `d = 20%`, tăng trưởng cuối kỳ `g = 4%`:

| Year | FCF ($M) | PV @20% |
|---|---|---|
| 1 | 1.00 | 0.83 |
| 2 | 1.25 | 0.87 |
| 3 | 1.56 | 0.90 |
| 4 | 1.95 | 0.94 |
| 5 | 2.44 | 0.98 |
| **Tổng PV tường minh** | | **≈ 4.52** |

Giá trị cuối kỳ ở cuối Năm 5 = `FCF₆ / (d − g) = (2.44 × 1.04) / (0.20 − 0.04) = $15.9M`; giá trị hiện tại của nó = `15.9 × 0.40 ≈ $6.4M`.

**Giá trị doanh nghiệp ≈ 4.52 + 6.40 = ~$10.9M.** Nếu ARR của Figma là ~$3M, thì **bội số ngầm ≈ 3.6× ARR** — *suy ra*, không phải giả định. Nhớ hai điều: **terminal value chiếm ~59% tổng** và tựa trên cái đầu vào lung lay nhất (`g`), đó là lý do người ta cãi nhau về DCF; và một "bội số doanh thu" chẳng qua là toàn bộ phép tính này nén lại thành một con số. `[synthesis — established underneath]`

### Chốt đi
Một founder chìa cho mày một DCF định giá công ty ở **$40M** và mời mày vào ở đúng giá đó. Mày để ý suất chiết khấu là **10%**. Trước khi đọc tiếp: *vì sao `d` là con số đầu tiên mày phải chất vấn — và cái $40M ra sao nếu suất trung thực là 30%?*

10% là chi phí vốn của một *công ty đại chúng trưởng thành*; ngưỡng thật của một startup giai đoạn đầu là 25–40%, vì rủi ro của nó khổng lồ. Đổi 10% thành 30% không phải cắt tỉa cái định giá — nó có thể làm nó **sụp**, vì terminal value (phần lớn của hầu hết mọi DCF, ~59% ở đây) là mảnh nhạy với chiết khấu nhất: một con `d` cao hơn vừa làm teo mọi đồng tương lai *vừa* làm teo cái số hạng cuối kỳ `1/(d−g)` cùng một lúc. Một DCF dựng trên suất chiết khấu quá thấp là cách *trông có vẻ* trung thực phổ biến nhất để thổi phồng một cái giá. Mày không cãi dòng tiền trước — mày cãi `d`, vì đó mới là chỗ con số thực sự được nặn ra.
</script>

# Vốn, pha loãng, và khi nào nên gọi vốn

Có một phản xạ, gần như phổ biến ở mọi founder, là coi chuyện *gọi được vốn* như một cột mốc — một cái tít, bằng chứng mày đã thành. Phản xạ đó là một cái bẫy đắt tiền. Gọi vốn không phải doanh thu, không phải chiến thắng, và không miễn phí: nó là **đồng tiền đắt nhất trên đời**, và ngay tại thời điểm chốt vòng, nó không làm mày giàu thêm đúng một xu. Chương này là thuốc giải — vốn thực sự tốn cái gì, mua được cái gì, và khi nào nhận nó là nước cờ tài tình so với khi nào nó chỉ là bán rẻ tương lai để có cảm giác đang tiến. Nó là mặt còn lại của câu chuyện tiền mặt từ Chương 3; mày đã đánh dấu tài trợ vốn là một điểm mù, nên tụi mình xây nó từ móng lên.

## Hai cách nuôi cỗ máy
- **Nợ (Debt)** — tiền vay trả lại kèm lãi; không nhường quyền sở hữu, nhưng phải trả từ tiền mặt. Rẻ hơn, nhưng không khoan nhượng khi tiền eo hẹp.
- **Vốn chủ (Equity)** — bán quyền sở hữu lấy tiền mặt; không phải trả lại gì, nhưng miếng đã cắt là mất vĩnh viễn. Đây là loại vốn đắt nhất (xem CAPM), và nó pha loãng (dilution) mày.

## Phép toán pha loãng
Gọi **$2M** ở mức định giá **pre-money $8M**:
```
Post-money  = pre + raise = 8 + 2 = $10M
Investor %  = 2 / 10 = 20%
Founder stake: 100% → 80%
```
**Pha loãng không phải là phá hủy.** Trước: 100% của $8M = $8M. Sau: 80% của $10M = vẫn $8M — *cộng* thêm $2M nhiên liệu trong bình. Gọi vốn là trung tính về giá trị ngay tại thời điểm chốt vòng; nó chỉ có lời nếu đồng vốn kiếm được **nhiều hơn cái nó tốn** (lợi nhuận kinh tế, Chương 1). Gọi vốn để lấp một vũng trũng tiền mặt mà mày không tự nuôi nổi, hoặc để mua tăng trưởng mà lợi suất của nó thắng được cái pha loãng — chứ không phải vì gọi vốn cho cảm giác như đang tiến. `[established]`

## Khi nào ba ca *cần* gọi vốn
- **Salesforce** — gần như bắt buộc. Nó âm $12k mỗi thương vụ (Chương 3); tăng trưởng enterprise dẫn dắt bởi bán hàng mà không có vốn thì bị bóp nghẹt.
- **Figma** — thường là không cần. Tự nuôi thân từ Ngày 0; nó chỉ gọi vốn để *tăng tốc*, từ vị thế được quyền chọn.
- **Mailchimp** — không nên gọi vốn đổ vào một cái thùng thủng; vốn dốc vào việc mua khách với churn 6% thì rỉ ra đáy hết. Sửa retention trước đã, không thì vòng gọi vốn chỉ đi nuôi cái lỗ.

> **Burn multiple** `[heuristic — Bessemer]`: `net cash burned / net new ARR added`. Dưới 1 là hàng đỉnh; 1–1.5 là khỏe; trên 2 là mày đang mua tăng trưởng một cách kém hiệu quả. Cách đọc nhanh nhất xem gọi thêm vốn sẽ tích lũy hay bốc hơi.

### Chốt đi
Hai founder đều có thể gọi **$5M ở mức pre-money $20M.** Founder A giống Figma (tự nuôi thân, vốn lưu động âm); Founder B giống Mailchimp (churn 6%/mo, thùng thủng). Cả hai đều bị cám dỗ. Trước khi đọc tiếp: *ai nên nhận tiền, ai không nên, và vì sao cùng một term sheet y hệt lại là món hời cho người này và cái bẫy cho người kia?*

**A nên — nhưng chỉ để tăng tốc**, từ vị thế được chọn: A vốn đã tự nuôi được mình, nên đồng vốn chỉ mua một phiên bản nhanh hơn của một cỗ máy đã chạy tốt, và nếu nó kiếm nhiều hơn chi phí ~30% thì cái pha loãng tự trả cho chính nó. **B không nên**: dốc $5M vào việc mua khách với churn 6%/tháng là đi nuôi một cái thùng cạn ra đáy — vòng gọi vốn không xây giá trị, nó *trợ giá cho chỗ rỉ*, và còn dâng đi 20% công ty để làm cái đó. Phép toán pha loãng thì y hệt; *lợi suất trên đồng vốn* thì ngược nhau. Gọi vốn chưa bao giờ là câu hỏi — **đồng vốn kiếm được cái gì so với cái nó tốn** mới là (lợi nhuận kinh tế, Ch1). Sửa retention của B trước khi B gọi lấy một đô, không thì vòng gọi vốn chỉ mua về một cái lỗ to hơn.

Nghề gọi vốn — dựng câu chuyện, điều khoản, quy trình — nằm ở M10–M11. Chương này là *phần tài chính* của nó: vốn tốn cái gì, mua được cái gì, và đòi hỏi cái gì.
</script>

<script type="text/markdown" id="content-M1-gloss">
<p class="kicker">M1 · Tra cứu</p>

# Bảng tra thuật ngữ & công thức

Tất cả gom về một chỗ. Nếu mày dựng lại được từng công thức *và nói ra được nó giả định cái gì*, thì mày làm chủ module này.

## Công thức
```
Contribution margin   = ARPA × gross margin%
Gross margin %        = (Revenue − COGS) / Revenue
CAC                   = acquisition spend / new customers
LTV (simple)          = contribution / churn = m / c
LTV (discounted)      = m × (1+d)/(c+d)
Payback (months)      = CAC / monthly contribution
LTV:CAC               = LTV / CAC            (aim ~3:1; audit >5:1)
Avg customer lifetime = 1 / churn
GRR                   = (start − churn − contraction) / start      (≤100%)
NRR                   = (start − churn − contraction + expansion) / start
Quick ratio           = (new + expansion) / (churn + contraction)
Breakeven units       = fixed costs / contribution per unit
Present value         = FV / (1+d)ⁿ
DCF value             = Σ FCFₜ / (1+d)ᵗ
Gordon terminal value = FCF_next / (d − g)
Post-money valuation  = pre-money + amount raised
Investor ownership    = amount raised / post-money
Rule of 40            = growth% + profit-margin%     (> 40)
Burn multiple         = net burn / net new ARR       (< 1 elite)
```

## Thuật ngữ
- **Accrual accounting** — kế toán dồn tích: doanh thu ghi khi kiếm được, chi phí ghi khi phát sinh, bất kể tiền vào ra lúc nào.
- **ARR / MRR** — nhịp chạy doanh thu định kỳ theo năm/tháng; một ảnh chụp nhanh, không phải doanh thu GAAP.
- **Bookings / Billings / Revenue** — đã ký hợp đồng / đã xuất hóa đơn / đã kiếm được. Hiếm khi bằng nhau.
- **Cohort** — nhóm khách hàng gộp theo ngày gia nhập, theo dõi qua thời gian; đơn vị trung thực để đo retention.
- **Contribution margin** — biên đóng góp: doanh thu trừ chi phí *biến đổi* để phục vụ; nuôi chi phí cố định + lợi nhuận.
- **Cost of capital (d)** — chi phí vốn: lợi suất đòi hỏi ứng với rủi ro; cái ngưỡng mỗi đồng phải vượt qua. Cao với startup (20–40%).
- **Deferred revenue** — doanh thu chưa thực hiện: tiền đã thu nhưng chưa kiếm được; một khoản nợ, và một món quà tài trợ tăng trưởng.
- **Economic profit** — lợi nhuận kinh tế: lợi nhuận kế toán trừ đi chi phí cơ hội của vốn. Bảng điểm thật.
- **GRR / NRR** — retention doanh thu gộp / ròng; NRR > 100% = một cái nền tự tích lũy.
- **Operating leverage** — đòn bẩy vận hành: lợi nhuận tăng nhanh hơn doanh thu vì chi phí cố định không tăng theo tỷ lệ 1:1.
- **Payback period** — kỳ hoàn vốn: số tháng để lấy lại CAC từ contribution; một thước đo rủi ro tiền mặt.
- **Unit economics** — mức sinh lời của một khách hàng đơn lẻ qua suốt đời họ.
- **Working capital** — vốn lưu động: tiền bị đóng băng trong chu kỳ vận hành; vốn lưu động âm thì đi nuôi mày.

*Bảng này là bản nén. Các chương mới là lý do vì sao mỗi dòng đúng — và khi nào nó nói dối.*
</script>

<script type="text/markdown" id="content-M1-notes">
<p class="kicker">M1 · Sổ tay</p>

# Sổ tay C1 — từ hội thoại

> Bản chưng cất từ một phiên đào sâu. Cả chương này chỉ là **một câu hỏi ở ba độ phóng đại**: *return có thắng nổi tiền thuê vốn không.*

## 1. Ba loại lợi nhuận — chúng đo hai TRỤC khác nhau

Đừng xếp ba loại lợi nhuận lên một hàng. Chúng lệch nhau trên hai trục độc lập:

- **Tiền mặt vs. Kế toán** khác nhau ở *THỜI ĐIỂM* — tiền đã thật sự chạy chưa, hay mới "kiếm được trên sổ".
- **Kinh tế vs. Kế toán** khác nhau ở *CÁI GÌ ĐƯỢC TÍNH LÀ CHI PHÍ* — lợi nhuận kinh tế trừ thêm một khoản mà kế toán không trừ: **chi phí cơ hội của vốn.**

→ Tiền mặt và kinh tế gần như chẳng liên quan gì nhau, vì lệch trên *cả hai* trục.

Ba đồng hồ trên cùng một cỗ máy:
- **Tiền mặt:** "tiền có thật sự dồn lên không?" (sống sót / thanh khoản)
- **Kế toán:** "kỳ này có tạo ra giá trị không, theo luật khớp doanh thu–chi phí?"
- **Kinh tế:** "đỗ vốn ở đây có đáng hơn phương án tốt nhất khác không?" (thước tàn nhẫn nhất)

Một business có thể **lãi kế toán dương + tiền mặt dương + lợi nhuận kinh tế ÂM** cùng lúc — vì kinh tế là thước duy nhất bắt trả tiền thuê cho vốn nằm trong máy.

```
Lợi nhuận kinh tế = lợi nhuận kế toán − (vốn đang dùng × chi phí vốn)
```

**Bẫy đã gỡ:** lợi nhuận kinh tế KHÔNG phải "vốn bị chôn trong vận hành". Vốn bị chôn là *đầu vào*; lợi nhuận kinh tế là *phán quyết* sau khi tính tiền thuê trên cái đầu vào đó.

## 2. Chi phí vốn = tiền thuê cho tiền mình đang giữ

| | Chi phí thường | Chi phí vốn |
|---|---|---|
| Bản chất | Giá thứ mày **TIÊU** (cháy mất khi dùng) | Giá thứ mày **GIỮ/THUÊ** (vốn quay về nguyên) |
| Hóa đơn | Có, ghi thẳng vào sổ | Phần lớn **vô hình**, tự gánh trong im lặng |
| Đơn vị | Một khoản tiền (X đồng) | Thường là **tỷ lệ %** trên vốn |

**Vốn không phải chi phí** — vì nó quay về. Bỏ 1đ mua nguyên liệu → cháy mất (chi phí thật). Bỏ 1đ làm vốn → nằm trong máy/tồn kho, bán ra lấy lại được. Nên "cái mày trả" không phải giá *mua* vốn, mà là **giá thuê** = lợi suất nó lẽ ra kiếm được ở chỗ khác cùng rủi ro.

**Vì sao không double-count:** kế toán chưa từng đếm đồng vốn gốc là chi phí (nó nằm ở bảng cân đối, nguyên vẹn). Chi phí kế toán cho vốn = 0. Lợi nhuận kinh tế nhét cái số bị thiếu vào. Không chồng lấn.

**Chi phí vốn pha HAI nguồn** (nhớ kẻo thấy lỗ hổng):
- **Nợ:** giá thuê = lãi vay → *có* hóa đơn, *có* vào P&L. Kế toán bắt được.
- **Vốn chủ sở hữu:** giá thuê = lợi suất cổ đông đòi → **không hóa đơn, không bao giờ vào sổ.** Con ma thật.

→ Lợi nhuận kinh tế sinh ra chủ yếu để đòi tiền thuê cho **phần vốn chủ** — thứ mà cả chi phí kế toán lẫn lãi vay đều không đụng.

Vay ngân hàng 5%/tháng = chi phí vốn *có hóa đơn*. Dùng tiền của chính mình → chi phí vốn *vẫn y nguyên*, chỉ vô hình (lợi suất lặng lẽ từ bỏ). Cùng một tiền thuê; ngân hàng chỉ làm nó lộ ra thành con số.

## 3. Đứng yên cũng có giá — và cái giá đó tương đối

Không có ô nào tên "giữ nguyên, không mất gì". Đứng yên là một vị thế, có giá.

**Ba vùng** (dấu của lợi nhuận kinh tế do *return so với chi phí vốn* quyết, không phải hoạt động/bất động):
- Return **>** chi phí vốn → **dương** (tạo của cải)
- Return **=** chi phí vốn → **0** (theo kịp alternative — đã là thành tích, không phải mốc khởi đầu)
- Return **<** chi phí vốn (kể cả = 0 khi ngồi im) → **âm** (tụt lại)

**Vạch 0 không phải "ngồi nghỉ"** — nó đã là *tiền đang chạy đúng bằng mức thị trường.* Điểm qua môn của lợi nhuận kinh tế = "thắng được tiền thuê", không phải "có lời".

Cái "mất" khi đứng yên là mất *tương đối* (tụt sau phương án tốt nhất), không phải số dư teo lại. Đo bằng *phương án tốt nhất có thật, trong tầm với, cùng rủi ro* — không phải jackpot tưởng tượng.

**Phanh** (kẻo phang quá tay "giữ tiền là ngu"):
- Chi phí vốn phải **khớp rủi ro** — không dí 12% (rủi ro business) lên tiền mặt nằm im.
- Giữ cash không tự động sai — mày đang *mua* thanh khoản/an toàn/optionality bằng lợi suất từ bỏ. Sai lầm duy nhất: **giữ cash mà tưởng nó free.**
- "Ngồi im" thành âm *nặng* khi **vốn backing nó đắt** (gọi equity kỳ vọng 12%, để tiền ăn 2%).

## 4. Đo return để so với chi phí vốn = ROIC

```
return = lợi nhuận sinh ra / vốn bỏ ra để sinh ra nó   → ROIC
so thẳng:  ROIC > chi phí vốn  →  dương
```

**Luật BẮT BUỘC khớp tầng** (sai là double-count):
- Return **toàn bộ vốn** (nợ+chủ): tử = NOPAT (lợi nhuận vận hành sau thuế, *trước* lãi vay), mẫu = tổng vốn → so với **WACC**.
- Return **riêng vốn chủ**: tử = lợi nhuận ròng (đã trừ lãi vay), mẫu = vốn chủ → **ROE**, so với **chi phí vốn chủ**.
- Đừng ghép tử tầng này với mẫu tầng kia (trừ lãi vay ở tử *rồi lại* tính cost of debt ở mẫu = phạt nợ hai lần).

Số: NOPAT 1.2 tỷ / vốn 10 tỷ = ROIC 12%, chi phí vốn 12% → hòa. Nếu 0.5 tỷ → ROIC 5% → `(5%−12%)×10 = −0.7 tỷ`.

**Nơi bị gian lận — mẫu số là chỗ mềm nhất.** Muốn ROIC đẹp mà không cần kiếm nhiều hơn, chỉ cần **bóp nhỏ mẫu**: ghi giảm tài sản, dùng giá sổ sách thay giá thay thế, tài sản khấu hao hết về ~0, đẩy nợ ra ngoài bảng. ROIC cao = moat thật HOẶC mẫu số bị làm teo → phân biệt được hai cái đó là kỹ năng operator.

**Trong SaaS, ROIC cấp công ty gần vô dụng** — vì đầu tư thật (R&D, CAC) bị *ghi thẳng vào chi phí*, không nằm ở bảng cân đối. Công cụ return native của SaaS = **LTV:CAC** (return-on-capital ở cấp một khách: CAC = vốn, dòng lợi nhuận vòng đời = return, payback = bao lâu vốn quay về).

## 5. LTV:CAC — bao nhiêu thì qua vạch chi phí vốn?

**Không có con số thần thánh. "3:1" là HEURISTIC, không suy ra từ chi phí vốn** — chỉ là biên an toàn của giới SaaS.

**LTV:CAC = 1 KHÔNG phải vạch hòa vốn**, vì: (a) LTV thường *không chiết khấu* → tiền tương lai rẻ hơn đúng bằng chi phí vốn → 1:1 đã lỗ về thời gian; (b) LTV thường chỉ là *biên đóng góp*, chưa gánh overhead.

**Vạch chính xác = `LTV-đã-chiết-khấu : CAC = 1`**, chiết khấu dòng đóng góp tương lai *đúng bằng chi phí vốn.* Lý do: PV(dòng khách) = CAC ⟺ NPV = 0 ⟺ khoản đầu tư vào khách đẻ ra đúng bằng chi phí vốn ⟺ lợi nhuận kinh tế = 0. → 3x chỉ là đệm chồng lên trên cho việc không chiết khấu + chưa gánh overhead + LTV lạc quan.

**Tỷ lệ GIẤU thời gian — chi phí vốn cắn qua THỜI GIAN.** Hai business cùng 4:1, một thằng payback 6 tháng, thằng kia 24 tháng → thằng sau khóa vốn lâu gấp 4, lợi nhuận kinh tế thấp hơn hẳn *dù tỷ lệ y hệt.* → Luôn soi **CAC payback (số tháng)** song song với tỷ lệ.

**Nơi bị gian lận:** LTV là số mềm nhất bảng. Hạ churn giả định + dùng gross margin thay contribution + không chiết khấu → thổi LTV:CAC từ 1.5 lên 6 trên đúng một business đang chìm.

## 6. LTV tính như nào — nó là DỰ BÁO, không phải sự thật để tra

```
LTV = Σₜ [ mₜ · Sₜ / (1+r)ᵗ ]
  mₜ = biên đóng góp kỳ t (doanh thu kỳ − chi phí biến đổi phục vụ khách đó); KHÔNG phải doanh thu, KHÔNG phải gross
  Sₜ = xác suất còn sống tới kỳ t (survival)
  r  = chiết khấu = chi phí vốn
```

Công thức folk `LTV = (ARPA × gross margin) / churn` = bộ xương bị bóp dưới **3 giả định dối**: churn không đổi (→ tuổi thọ = 1/churn), margin không đổi, không chiết khấu. Dối nặng nhất = "churn không đổi".

**Phụ thuộc mô hình kinh doanh — sâu** (hình dạng `mₜ`, `Sₜ` đổi hẳn):
- **Subscription phí phẳng** (Netflix): `m` phẳng → retention là vua.
- **SaaS seat/usage có expansion** (Slack, Snowflake): `mₜ` *tăng*; NRR>100% → tích `m·S` đi LÊN, LTV lớn hơn naive nhiều. GRR/NRR sống ở đây.
- **Giao dịch/không hợp đồng** (e-com, marketplace): không có nút "hủy" — khách lặng lẽ biến mất, phải mô hình *xác suất còn sống* từ recency/frequency (buy-till-you-die). Toán khác hẳn.
- **Mua một lần:** LTV ≈ một biên đóng góp, retention vô nghĩa.

**Retention khác theo cohort — hai nghĩa, đừng gộp:**
- **(a) Khác GIỮA cohort:** cohort T1 ≠ cohort T6 (kênh, giá, độ chín sản phẩm, ICP trôi). Blended churn = con lai không mô tả cohort thật nào; mix đổi thì blended nhảy *dù chẳng cohort nào đổi hành vi* (camouflage).
- **(b) Khác TRONG đời một cohort:** đường cong dốc đầu rồi *phẳng* (kẻ sai-fit bỏ sớm, tín đồ trụ years). Churn-cố-định vẽ đường trượt mượt về 0; thực tế là cái *kệ* → churn-cố-định **understate** LTV.

**Làm gì:**
1. Vứt churn blended → tính LTV *từng cohort*, từ survival curve *quan sát thật*.
2. Cohort trẻ chưa sống đủ lâu → phải *ngoại suy cái đuôi*, mượn hình dạng cohort già làm khuôn. **Cái đuôi chưa quan sát = nơi LTV bị thổi phồng.**
3. Cắt theo segment (kênh/gói/ICP), đừng một số công ty — blended giấu cohort trả-tiền đang chìm trong khi organic gánh trung bình.

**Nắm về nhà:** LTV là *dự báo mày dựng*, không phải sự thật để tra — nó nói về hành vi *chưa xảy ra*. Survival curve per-cohort là nền *ít dối nhất*, nhưng vẫn phải forecast cái đuôi.

**Tell của operator:** ai đưa một con LTV mà không có cohort curve đằng sau, không tách *observed vs. extrapolated*, không kèm GRR (sàn thật, bỏ expansion) → đó là truyện, không phải số đo.

## Sợi chỉ xuyên suốt C1

Lợi nhuận kinh tế → ROIC → LTV:CAC là **cùng một câu hỏi ở ba độ phóng đại**: *return có thắng nổi tiền thuê vốn không.*
- Cấp công ty: `ROIC vs WACC`
- Cấp một khách: `LTV-chiết-khấu : CAC` (vượt 1 = thắng)
- Ở mọi cấp, kẻ giết mày không phải con số danh nghĩa, mà là **tiền thuê vô hình** (chi phí vốn chủ) + **thời gian** (payback) + **cái đuôi chưa quan sát** (giả định retention).
</script>
